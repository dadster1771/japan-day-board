<head>
<meta charset="utf-8">
<title>Japan Day Board</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japan">

<style>
/* Light theme is pinned on purpose: Brett's phone and desktop both run dark,
   and this needs to stay a high-contrast light surface wherever it opens. */
:root{
  color-scheme: light;
  --paper:#f8f6f1;
  --ground:#e7eef6;
  --card:#fffdf8;
  --ink:#1c262e;
  --ink2:#4d5b67;
  --ink3:#79868f;
  --line:#d4dce4;
  --line2:#c0ccd6;

  --yes-fg:#1f6b41; --yes-bg:#daeee1; --yes-br:#9ccfb1;
  --may-fg:#7a5a06; --may-bg:#f8eecb; --may-br:#ddc27a;
  --plan-fg:#15527f; --plan-bg:#d6e7f4; --plan-br:#96c0dd;
  --must-fg:#9a3c18; --must-bg:#fadfd4; --must-br:#e8ab8e;
  --me-fg:#5b2d82;  --me-bg:#ebdff5;  --me-br:#c3a3dd;

  --r:14px;
  --tap:48px;
  --shadow:0 1px 0 var(--line2), 0 2px 10px rgba(28,38,46,.055);
  --font:Verdana,Tahoma,Geneva,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);background:var(--ground);color:var(--ink);
  font-size:16px;line-height:1.5;letter-spacing:.005em;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--plan-fg);text-decoration:none}          /* no underlines, by preference */
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}

/* ---------------------------------------------------------------- header */
header{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 12px rgba(28,38,46,.06);
}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;max-width:720px;margin:0 auto}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--ink3);font-weight:400}
.today-btn{
  margin-left:auto;background:var(--plan-bg);color:var(--plan-fg);
  border:1px solid var(--plan-br);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:700;min-height:36px;
}
.today-btn[hidden]{display:none}

/* day strip */
.strip{display:flex;gap:7px;overflow-x:auto;padding:2px 12px 10px;max-width:720px;margin:0 auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;scroll-snap-align:center;
  min-width:52px;padding:6px 9px 7px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);
  text-align:center;line-height:1.2;
}
.chip b{display:block;font-size:16px}
.chip i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);margin-top:1px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on i{color:#c3ced7}
.chip.now{border-color:var(--must-br);border-width:2px}

/* ---------------------------------------------------------------- tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 14px rgba(28,38,46,.07);
}
.tabs-in{display:flex;max-width:720px;margin:0 auto}
.tab{
  flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:11.5px;color:var(--ink3);font-weight:700;
}
.tab em{font-style:normal;font-size:20px;line-height:1}
.tab.on{color:var(--plan-fg)}
.tab.on em{transform:translateY(-1px)}

/* ---------------------------------------------------------------- cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.pad{padding:13px 14px}
.dayhead .eyebrow{font-size:12px;color:var(--ink3);font-weight:700}
.dayhead h1{font-size:22px;margin:3px 0 0;line-height:1.2}
.dayhead .sub{font-size:13.5px;color:var(--ink2);margin-top:5px}
.hotel{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);
  border-top:1px dashed var(--line2);margin-top:11px;padding-top:10px}

.sechead{display:flex;align-items:baseline;gap:8px;margin:20px 2px 7px}
.sechead h2{font-size:15px}
.sechead .n{font-size:12px;color:var(--ink3);font-weight:700}

/* ---------------------------------------------------------------- rows */
.row{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:12px 14px;border-top:1px solid var(--line);min-height:var(--tap);
}
.row:first-child{border-top:0}
.row:active{background:var(--ground)}
.row.anchored{background:var(--me-bg)}
.marker{flex:0 0 26px;height:26px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;margin-top:1px;
  background:var(--ground);color:var(--ink2);border:1px solid var(--line2)}
.marker.plan{background:var(--plan-bg);color:var(--plan-fg);border-color:var(--plan-br)}
.marker.yes{background:var(--yes-bg);color:var(--yes-fg);border-color:var(--yes-br)}
.marker.may{background:var(--may-bg);color:var(--may-fg);border-color:var(--may-br)}
.marker.me{background:var(--me-bg);color:var(--me-fg);border-color:var(--me-br)}
.rbody{flex:1;min-width:0}
.rname{font-size:15.5px;font-weight:700;line-height:1.3}
.row.sub .rname{font-size:14.5px;font-weight:400}
.row.sub{padding-left:38px}
.row.trans .rname,.row.note .rname{font-weight:400;color:var(--ink2);font-size:14px}
.rmeta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.rdist{flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--ink2);font-weight:700;
  margin-top:2px;line-height:1.35;white-space:nowrap}
.rdist i{display:block;font-style:normal;font-weight:400;color:var(--ink3);font-size:11px}
.details{margin:5px 0 0;padding:0;list-style:none}
.details li{font-size:12.5px;color:var(--ink2);padding-left:11px;position:relative;margin-top:2px}
.details li:before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--line2)}

/* vote chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vc{font-size:11.5px;font-weight:700;padding:2.5px 7px;border-radius:7px;border:1px solid}
.vc.yes{background:var(--yes-bg);color:var(--yes-fg);border-color:var(--yes-br)}
.vc.may{background:var(--may-bg);color:var(--may-fg);border-color:var(--may-br)}
.vc.must{background:var(--must-bg);color:var(--must-fg);border-color:var(--must-br)}
.vc.plan{background:var(--plan-bg);color:var(--plan-fg);border-color:var(--plan-br)}
.vc.flat{background:var(--ground);color:var(--ink2);border-color:var(--line2);font-weight:400}

/* ---------------------------------------------------------------- anchor bar */
.anchor{
  background:var(--me-bg);border:1px solid var(--me-br);border-radius:var(--r);
  padding:11px 13px;margin:12px 0;box-shadow:var(--shadow);
}
.anchor .lbl{font-size:12px;color:var(--me-fg);font-weight:700}
.anchor .val{font-size:15.5px;font-weight:700;margin-top:3px;line-height:1.3}
.anchor .hint{font-size:12px;color:var(--ink2);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  min-height:42px;padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{background:var(--ground)}
.btn.primary{background:var(--plan-fg);border-color:var(--plan-fg);color:#fff}
.btn.sm{min-height:36px;padding:7px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45}

/* filters */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--card);border:1px solid var(--line);min-height:38px}
.f.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------------------------------------------------------------- map */
.maph{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
svg.map{display:block;width:100%;height:auto;background:
  radial-gradient(circle at 30% 20%, #f2f7fc 0%, #e7eef6 60%, #dfe8f1 100%)}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:11px 13px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid}
.dot.plan{background:var(--plan-bg);border-color:var(--plan-fg)}
.dot.yes{background:var(--yes-bg);border-color:var(--yes-fg)}
.dot.may{background:var(--may-bg);border-color:var(--may-fg)}
.dot.me{background:var(--me-bg);border-color:var(--me-fg)}

/* ---------------------------------------------------------------- sheet */
.scrim{position:fixed;inset:0;background:rgba(20,28,34,.42);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.25,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(20,28,34,.26);
  -webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.grab{width:42px;height:4px;border-radius:999px;background:var(--line2);margin:9px auto 2px}
.sheet .pad{padding:8px 18px 0}
.sheet h3{font-size:20px;line-height:1.25}
.sheet .where{font-size:13px;color:var(--ink3);margin-top:4px}
.sheet .note{font-size:14px;color:var(--ink2);margin-top:10px;background:var(--ground);
  border-radius:10px;padding:9px 11px}
.sheet .addr{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45}
.kv{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.kvi{flex:1 1 44%;background:var(--ground);border-radius:11px;padding:9px 11px;min-width:130px}
.kvi .k{font-size:11px;color:var(--ink3);font-weight:700}
.kvi .v{font-size:16px;font-weight:700;margin-top:2px}
.linkwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.linkwrap .cap{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.offline-note{font-size:11.5px;color:var(--must-fg);background:var(--must-bg);
  border:1px solid var(--must-br);border-radius:8px;padding:6px 9px;margin-top:9px}

.empty{text-align:center;color:var(--ink3);font-size:14px;padding:26px 18px}
.foot{font-size:11.5px;color:var(--ink3);text-align:center;padding:16px 12px 6px;line-height:1.6}
</style>
</head>

</nav>

8712, Japan","geo":"ROOFTOP","id":"s178","key":"Tokyo»Ueno»Tokyo National Museum","days":[]},{"name":"Tsukiji Fish Market","city":"Tokyo","area":"Ueno","note":"true authentic fish market).* Lots of seafood (site","cat":"Food","b":"maybe","j":"yes","bm":false,"jm":false,"lat":35.6647703,"lng":139.7702515,"address":"Japan, 〒104-0045 Tokyo, Chuo City, Tsukiji, 4-chōme−16 および６丁目一部","geo":"partial","id":"s179","key":"Tokyo»Ueno»Tsukiji Fish Market","days":[]},{"name":"Ueno Park","city":"Tokyo","area":"Ueno","note":"Pretty areas to walk (info","cat":"Nature","b":"maybe","j":"","bm":false,"jm":false,"lat":35.714756,"lng":139.773431,"address":"Ueno, Taito City, Tokyo 110-0005, Japan","geo":"maps","id":"s180","key":"Tokyo»Ueno»Ueno Park","days":[]}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("tripdata").textContent);
const DAYS = DATA.days, SPOTS = DATA.spots, HOTELS = DATA.hotels || [];

/* ---------------------------------------------------------------- geo math */
const R = 6371000;
function metres(a, b){
  if(!a || !b || a.lat == null || b.lat == null) return null;
  const p = Math.PI/180;
  const dla = (b.lat-a.lat)*p, dlo = (b.lng-a.lng)*p;
  const la1 = a.lat*p, la2 = b.lat*p;
  const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* Straight line, padded for the fact that you cannot walk through buildings.
   1.3x detour on a city grid, 80 m/min is a normal walking pace. */
const DETOUR = 1.3, MPM = 80;
function walkMin(m){ return Math.max(1, Math.round(m*DETOUR/MPM)); }
function distLabel(m){
  if(m == null) return "";
  if(m > 1600) return (m/1000).toFixed(m < 10000 ? 1 : 0) + " km";
  return Math.round(m/10)*10 + " m";
}
function travelLabel(m){
  if(m == null) return "";
  if(m > 2500) return "train";
  return "~" + walkMin(m) + " min";
}

/* ---------------------------------------------------------------- vote model */
const RANK = { yes:2, maybe:1, "":0, no:0 };
function voteChips(s){
  const out = [];
  const b = s.b, j = s.j;
  if(b === "yes" && j === "yes") out.push(["yes","Both yes"]);
  else{
    if(b === "yes") out.push(["yes","Brett yes"]);
    else if(b === "maybe") out.push(["may","Brett maybe"]);
    if(j === "yes") out.push(["yes","Jessa yes"]);
    else if(j === "maybe") out.push(["may","Jessa maybe"]);
  }
  if(s.bm) out.push(["must","Brett must-do"]);
  if(s.jm) out.push(["must","Jessa must-do"]);
  return out;
}
function voteShort(s){
  const b = s.b, j = s.j;
  if(b === "yes" && j === "yes") return "Both yes";
  const p = [];
  if(b === "yes") p.push("B yes"); else if(b === "maybe") p.push("B maybe");
  if(j === "yes") p.push("J yes"); else if(j === "maybe") p.push("J maybe");
  return p.join(" · ") || "no vote";
}
function strength(s){
  // lower sorts first inside an equal-distance tie
  let v = 10 - (RANK[s.b]||0)*2 - (RANK[s.j]||0)*2;
  if(s.bm || s.jm) v -= 3;
  return v;
}
function markerClass(s){
  if(s.b === "yes" || s.j === "yes") return "yes";
  return "may";
}
/* area / city / category, with repeats dropped: the sheet often files a spot under
   an area that is just its city or its own category again. */
function metaLine(parts, noPin){
  const seen = new Set(), out = [];
  for(const p of parts){
    const v = (p || "").trim();
    if(!v) continue;
    const k = v.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(v);
  }
  if(noPin) out.push("no map pin");
  return out.join(" · ");
}

/* ---------------------------------------------------------------- state */
const LS = "jdb.v1";
const state = {
  tab:"plan",
  day:1,
  anchor:null,          // {lat,lng,label,sub,kind:'gps'|'spot'}
  filter:"all",
  gpsWatch:null,
  gpsErr:"",
};
try{
  const saved = JSON.parse(localStorage.getItem(LS) || "{}");
  if(saved.day) state.day = saved.day;
  if(saved.filter) state.filter = saved.filter;
  if(saved.anchor && saved.anchor.kind === "spot") state.anchor = saved.anchor;
}catch(e){}
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      day:state.day, filter:state.filter,
      anchor: state.anchor && state.anchor.kind === "spot" ? state.anchor : null
    }));
  }catch(e){}
}

function todayDay(){
  const now = new Date();
  const iso = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0")
            + "-" + String(now.getDate()).padStart(2,"0");
  const hit = DAYS.find(d => d.date === iso);
  if(hit) return hit.n;
  if(iso < DAYS[0].date) return 1;
  if(iso > DAYS[DAYS.length-1].date) return DAYS.length;
  return 1;
}
const TODAY = todayDay();
if(!sessionStorage.getItem("jdb.opened")){
  state.day = TODAY;
  sessionStorage.setItem("jdb.opened","1");
}

/* #day=3&tab=near keeps the iPhone back button working and makes any view linkable */
function readHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/,""));
  const d = +h.get("day");
  if(d >= 1 && d <= DAYS.length) state.day = d;
  const t = h.get("tab");
  if(["plan","near","map","all"].includes(t)) state.tab = t;
}
function writeHash(){
  const want = "#day=" + state.day + "&tab=" + state.tab;
  if(location.hash !== want) history.replaceState(null, "", want);
}
readHash();
window.addEventListener("hashchange", () => { readHash(); render(); });

function day(){ return DAYS.find(d => d.n === state.day) || DAYS[0]; }
function hotelFor(d){
  return HOTELS.find(h => d.date >= h.in && d.date < h.out) || null;
}

/* every pinnable thing, with a consistent shape */
function planItems(d){
  return d.stops.map((s,i) => Object.assign({}, s, {
    _t:"stop", _id:"d"+d.n+"s"+i, _day:d.n
  }));
}
function pickItems(){
  return SPOTS.map(s => Object.assign({}, s, { _t:"pick", _id:s.id }));
}

/* ---------------------------------------------------------------- escaping */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ---------------------------------------------------------------- render */
const main = document.getElementById("main");

function renderStrip(){
  const el = document.getElementById("strip");
  el.innerHTML = DAYS.map(d => {
    const wd = d.weekday.slice(0,3);
    return `<button class="chip${d.n===state.day?" on":""}${d.n===TODAY?" now":""}" data-day="${d.n}">
      <b>${d.n}</b><i>${esc(wd)}</i></button>`;
  }).join("");
  const on = el.querySelector(".chip.on");
  if(on) on.scrollIntoView({block:"nearest", inline:"center"});
  document.getElementById("brandDay").textContent =
    state.day === TODAY ? "· today" : "";
  document.getElementById("todayBtn").hidden = (state.day === TODAY);
}

function anchorCard(){
  const a = state.anchor;
  const gpsOn = a && a.kind === "gps";
  return `<div class="anchor">
    <div class="lbl">Measuring from</div>
    <div class="val">${a ? esc(a.label) : "Nothing picked yet"}</div>
    <div class="hint">${
      a ? esc(a.sub || "") :
      "Tap any stop below, or use your location, and everything gets sorted by how far it is from there."
    }</div>
    <div class="btns">
      <button class="btn ${gpsOn?"":"primary"}" id="gpsBtn">
        ${gpsOn ? "◉ Using my location" : "◎ Use my location"}
      </button>
      ${a ? `<button class="btn sm" id="clearAnchor">Clear</button>` : ""}
    </div>
    ${state.gpsErr ? `<div class="offline-note">${esc(state.gpsErr)}</div>` : ""}
  </div>`;
}

function distCell(item){
  if(!state.anchor || item.lat == null) return "";
  const m = metres(state.anchor, item);
  if(m == null) return "";
  if(m < 40) return `<div class="rdist">here<i>&nbsp;</i></div>`;
  return `<div class="rdist">${esc(travelLabel(m))}<i>${esc(distLabel(m))}</i></div>`;
}

function stopRow(s, idx){
  const cls = s.kind === "transit" ? "trans" : s.kind === "note" ? "note" : "";
  const sub = s.depth >= 1 ? " sub" : "";
  const anchored = state.anchor && state.anchor.ref === s._id ? " anchored" : "";
  let mk = s.kind === "stop" ? "plan" : "";
  let glyph = s.kind === "transit" ? "→" : s.kind === "note" ? "·" : String(idx);
  if(anchored){ mk = "me"; glyph = "◉"; }
  const det = (s.details || []).length
    ? `<ul class="details">${s.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : "";
  const linked = s.poolkey ? SPOT_BY_KEY.get(s.poolkey) : null;
  const meta = metaLine([s.cat], s.lat == null && s.kind === "stop");
  const chips = linked
    ? voteChips(linked).map(c => `<span class="vc ${c[0]}">${esc(c[1])}</span>`).join("")
    : "";
  return `<button class="row ${cls}${sub}${anchored}" data-stop="${esc(s._id)}">
    <span class="marker ${mk}">${glyph}</span>
    <span class="rbody">
      <span class="rname">${esc(s.name)}</span>
      ${meta ? `<span class="rmeta">${esc(meta)}</span>` : ""}
      ${chips ? `<span class="chips">${chips}</span>` : ""}
      ${det}
    </span>
    ${distCell(s)}
  </button>`;
}

function pickRow(s, opts){
  opts = opts || {};
  const chips = voteChips(s).map(c => `<span class="vc ${c[0]}">${esc(c[1])}</span>`).join("");
  const days = (opts.planDays || []).filter(n => n !== s._today);
  const onPlan =
      (s._today ? `<span class="vc plan">on today's plan</span>` : "")
    + (days.length ? `<span class="vc plan">listed day ${days.join(", ")}</span>` : "");
  const anchored = state.anchor && state.anchor.ref === s._id ? " anchored" : "";
  const meta = metaLine([s.area, s.city, s.cat], s.lat == null);
  return `<button class="row${anchored}" data-pick="${esc(s.id)}">
    <span class="marker ${anchored?"me":markerClass(s)}">${anchored?"◉":"★"}</span>
    <span class="rbody">
      <span class="rname">${esc(s.name)}</span>
      <span class="rmeta">${esc(meta)}</span>
      <span class="chips">${chips}${onPlan}</span>
    </span>
    ${distCell(s)}
  </button>`;
}

/* ------------------------------------------------- PLAN */
function viewPlan(){
  const d = day();
  const h = hotelFor(d);
  const items = planItems(d);
  let n = 0;

  // anything already shown as a line in the plan should not repeat below it
  const onPlanKeys = new Set(
    items.filter(s => s.poolkey && SPOT_BY_KEY.has(s.poolkey)).map(s => s.poolkey)
  );
  const dayPicks = SPOTS
    .filter(s => (s.days || []).includes(d.n) && !onPlanKeys.has(s.key))
    .map(s => Object.assign({}, s, {_t:"pick", _id:s.id}));

  // also surface anything close to today's route that is not listed for today
  const route = items.filter(s => s.lat != null);
  const near = [];
  if(route.length){
    for(const s of SPOTS){
      if(s.lat == null) continue;
      if((s.days||[]).includes(d.n) || onPlanKeys.has(s.key)) continue;
      let best = Infinity;
      for(const r of route){
        const m = metres(r, s);
        if(m != null && m < best) best = m;
      }
      if(best <= 1200) near.push(Object.assign({}, s, {_t:"pick", _id:s.id, _near:best}));
    }
    near.sort((a,b) => a._near - b._near);
  }

  const dpSorted = sortByAnchor(dayPicks);
  const nearSorted = near.slice(0, 14);

  return `
  <div class="card dayhead"><div class="pad">
    <div class="eyebrow">Day ${d.n} of ${DAYS.length}${d.n===TODAY?" · today":""}</div>
    <h1>${esc(d.title)}</h1>
    <div class="sub">${esc(d.weekday)}, ${esc(d.label)}${d.city?" · "+esc(d.city):""}</div>
    ${h ? `<div class="hotel"><span>⌂</span><span>Staying at <b>${esc(h.name)}</b>, ${esc(h.city)}</span></div>` : ""}
  </div></div>

  ${anchorCard()}

  <div class="sechead"><h2>The plan</h2><span class="n">${items.length} lines</span></div>
  <div class="card">${
    items.length
      ? items.map(s => { if(s.kind === "stop") n++; return stopRow(s, s.kind==="stop"?n:0); }).join("")
      : `<div class="empty">Nothing scheduled.</div>`
  }</div>

  <div class="sechead"><h2>Your picks listed for this day</h2><span class="n">${dpSorted.length}</span></div>
  <div class="card">${
    dpSorted.length ? dpSorted.map(s => pickRow(s)).join("")
                    : `<div class="empty">None listed against this day.</div>`
  }</div>

  ${nearSorted.length ? `
  <div class="sechead"><h2>Also within walking distance of today's route</h2><span class="n">${nearSorted.length}</span></div>
  <div class="card">${nearSorted.map(s => pickRow(s, {planDays:(s.days||[])})).join("")}</div>` : ""}

  <div class="foot">
    Walk times are straight-line distance padded 30% for real streets, at 80 m per minute.
    Treat them as a rough guide, not a route.<br>
    Built ${esc(DATA.generated)} from the Nov 17 itinerary and the trip planner sheet.
  </div>`;
}

/* ------------------------------------------------- NEARBY */
const FILTERS = [
  ["all","Everything"],
  ["yes","Yes only"],
  ["must","Must-dos"],
  ["food","Food"],
  ["15","Within 15 min"],
  ["plan","On the plan"],
];
function passFilter(it){
  switch(state.filter){
    case "yes":  return it.b === "yes" || it.j === "yes" || it._t === "stop" || !!it._today;
    case "must": return !!(it.bm || it.jm);
    case "food": return /food|eat|restaurant|cafe|café|dessert|bar|sweets|drink/i
                        .test((it.cat||"") + " " + (it.area||""));
    case "15":   { const m = state.anchor ? metres(state.anchor, it) : null;
                   return m != null && walkMin(m) <= 15; }
    case "plan": return it._t === "stop" || !!it._today;
    default:     return true;
  }
}
function sortByAnchor(list){
  const a = state.anchor;
  return list.slice().sort((x,y) => {
    if(a){
      const mx = metres(a,x), my = metres(a,y);
      if(mx != null && my != null && Math.abs(mx-my) > 5) return mx - my;
      if(mx != null && my == null) return -1;
      if(mx == null && my != null) return 1;
    }
    const sx = x._t === "stop" ? -1 : strength(x), sy = y._t === "stop" ? -1 : strength(y);
    if(sx !== sy) return sx - sy;
    return (x.name||"").localeCompare(y.name||"");
  });
}

const SPOT_BY_KEY = new Map(SPOTS.map(s => [s.key, s]));

/* One row per physical place. A stop that is also a voted spot is dropped in
   favour of the voted spot, which then carries the "on today's plan" tag. */
function mergedPool(d){
  const planned = planItems(d).filter(s => s.kind === "stop" && s.lat != null);
  const onPlan = new Set();
  const out = [];
  for(const s of planned){
    if(s.poolkey && SPOT_BY_KEY.has(s.poolkey)) onPlan.add(s.poolkey);
    else out.push(s);
  }
  for(const s of pickItems()){
    out.push(onPlan.has(s.key) ? Object.assign({}, s, {_today:d.n}) : s);
  }
  return out;
}

function viewNear(){
  const d = day();
  const pool = mergedPool(d);

  const list = sortByAnchor(pool.filter(passFilter));
  const shown = list.slice(0, 120);

  return `
  ${anchorCard()}
  <div class="filters">${
    FILTERS.map(f => `<button class="f${state.filter===f[0]?" on":""}" data-f="${f[0]}">${esc(f[1])}</button>`).join("")
  }</div>
  <div class="sechead"><h2>${state.anchor ? "Closest first" : "Everything you said yes or maybe to"}</h2>
    <span class="n">${list.length}</span></div>
  <div class="card">${
    shown.length ? shown.map(s =>
      s._t === "stop"
        ? planRowInNear(s, d)
        : pickRow(s, {planDays:(s.days||[])})
    ).join("") : `<div class="empty">Nothing matches that filter.</div>`
  }</div>
  ${list.length > shown.length ? `<div class="foot">Showing the nearest ${shown.length} of ${list.length}.</div>` : ""}
  <div class="foot">Stops on today's plan are tagged so you can tell them apart from picks.</div>`;
}
function planRowInNear(s, d){
  const anchored = state.anchor && state.anchor.ref === s._id ? " anchored" : "";
  return `<button class="row${anchored}" data-stop="${esc(s._id)}">
    <span class="marker ${anchored?"me":"plan"}">${anchored?"◉":"■"}</span>
    <span class="rbody">
      <span class="rname">${esc(s.name)}</span>
      <span class="rmeta">${esc(d.city||"")}${s.cat?" · "+esc(s.cat):""}</span>
      <span class="chips"><span class="vc plan">on day ${d.n} plan</span></span>
    </span>
    ${distCell(s)}
  </button>`;
}

/* ------------------------------------------------- MAP (no tiles, works offline) */
function viewMap(){
  const d = day();
  const pts = [];
  const onPlanKeys = new Set();
  for(const s of planItems(d)){
    if(s.lat == null || s.kind === "note") continue;
    if(s.poolkey && SPOT_BY_KEY.has(s.poolkey)) onPlanKeys.add(s.poolkey);
    pts.push({t:"plan", s});
  }
  const route = pts.map(p => p.s);
  for(const s of SPOTS){
    if(s.lat == null) continue;
    if(onPlanKeys.has(s.key)) continue;       // already drawn as a plan dot
    let best = Infinity;
    for(const r of route){ const m = metres(r,s); if(m != null && m < best) best = m; }
    if((s.days||[]).includes(d.n) || best <= 2500){
      pts.push({t: markerClass(s), s:Object.assign({}, s, {_t:"pick", _id:s.id})});
    }
  }
  if(state.anchor && state.anchor.lat != null){
    pts.push({t:"me", s:Object.assign({}, state.anchor, {name:state.anchor.label, _id:"__me"})});
  }
  if(!pts.length){
    return `${anchorCard()}<div class="card"><div class="empty">
      No pinned places for day ${d.n}.</div></div>`;
  }

  /* Frame the day's route, not every pick: one spot 5 km away would otherwise
     squash the whole walk into a thumbprint. Anything outside the frame is still
     drawn, pinned to the edge, so you can see which way it lies. */
  const midLat = pts.reduce((a,p) => a + p.s.lat, 0) / pts.length;
  const kx = Math.cos(midLat*Math.PI/180);
  const X = p => p.s.lng * kx, Y = p => -p.s.lat;

  let fit = pts.filter(p => p.t === "plan" || p.t === "me");
  if(fit.length < 2) fit = pts.slice();
  const cx0 = fit.reduce((a,p) => a + X(p), 0) / fit.length;
  const cy0 = fit.reduce((a,p) => a + Y(p), 0) / fit.length;
  const rad = fit.map(p => Math.hypot(X(p)-cx0, Y(p)-cy0)).sort((a,b) => a-b);
  const cut = rad[Math.max(0, Math.min(rad.length-1, Math.floor(rad.length*0.85)))] * 1.25;
  let keep = fit.filter(p => Math.hypot(X(p)-cx0, Y(p)-cy0) <= cut);
  if(keep.length < 2) keep = fit;

  let x0 = Math.min(...keep.map(X)), x1 = Math.max(...keep.map(X));
  let y0 = Math.min(...keep.map(Y)), y1 = Math.max(...keep.map(Y));
  const MIN = 0.0022;                                  // ~240 m, so one stop is not infinite zoom
  if(x1-x0 < MIN){ const c=(x0+x1)/2; x0=c-MIN/2; x1=c+MIN/2; }
  if(y1-y0 < MIN){ const c=(y0+y1)/2; y0=c-MIN/2; y1=c+MIN/2; }
  const padw = (x1-x0)*0.18, padh = (y1-y0)*0.18;
  x0 -= padw; x1 += padw; y0 -= padh; y1 += padh;

  const W = 1000;
  const H = Math.round(W * Math.max(0.85, Math.min(1.25, (y1-y0)/(x1-x0) || 1)));
  const EDGE = 26;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
  const rawx = p => ((X(p)-x0)/(x1-x0))*W;
  const rawy = p => ((Y(p)-y0)/(y1-y0))*H;
  const px = p => clamp(rawx(p), EDGE, W-EDGE);
  const py = p => clamp(rawy(p), EDGE, H-EDGE);
  const offscreen = p => rawx(p) < EDGE || rawx(p) > W-EDGE
                      || rawy(p) < EDGE || rawy(p) > H-EDGE;

  // scale bar
  const metresPerPx = metres({lat:midLat,lng:x0/kx},{lat:midLat,lng:x1/kx}) / W;
  const targets = [100,200,500,1000,2000,5000];
  const barM = targets.find(t => t/metresPerPx > W*0.14) || 5000;
  const barPx = barM/metresPerPx;

  const COL = {
    plan:["var(--plan-bg)","var(--plan-fg)"],
    yes:["var(--yes-bg)","var(--yes-fg)"],
    may:["var(--may-bg)","var(--may-fg)"],
    me:["var(--me-bg)","var(--me-fg)"],
  };
  const order = {plan:2, yes:1, may:0, me:3};
  pts.sort((a,b) => (order[a.t]||0) - (order[b.t]||0));

  // connect the day's pinned stops in itinerary order
  const line = pts.filter(p => p.t === "plan")
    .map(p => `${px(p).toFixed(1)},${py(p).toFixed(1)}`).join(" ");

  const dots = pts.map(p => {
    const [bg,fg] = COL[p.t] || COL.may;
    const off = offscreen(p);
    const r = (p.t === "me" ? 15 : p.t === "plan" ? 13 : 10) * (off ? 0.72 : 1);
    const must = p.s.bm || p.s.jm;
    const x = px(p).toFixed(1), y = py(p).toFixed(1);
    return `<g class="pt" data-${p.s._t==="stop"?"stop":(p.s._id==="__me"?"none":"pick")}="${esc(p.s._t==="stop"?p.s._id:p.s.id||"")}">
      <circle cx="${x}" cy="${y}" r="${r+13}" fill="transparent"></circle>
      ${must?`<circle cx="${x}" cy="${y}" r="${(r+5).toFixed(1)}" fill="none"
        stroke="var(--must-fg)" stroke-width="2.5" stroke-dasharray="4 3"></circle>`:""}
      <circle cx="${x}" cy="${y}" r="${r.toFixed(1)}"
        fill="${bg}" stroke="${fg}" stroke-width="3"
        ${off?'stroke-dasharray="3 3" opacity="0.75"':""}></circle>
    </g>`;
  }).join("");

  /* Label the route and the anchor only, and drop any label that would land on
     one already placed: an unreadable pile of names is worse than fewer names. */
  const taken = [];
  const hit = (a) => taken.some(b =>
    !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1));
  const labels = pts
    .filter(p => (p.t === "plan" || p.t === "me") && !offscreen(p))
    .sort((a,b) => (a.t === "me" ? -1 : 0) - (b.t === "me" ? -1 : 0))  // anchor label wins
    .map(p => {
      const txt = (p.s.name || "").slice(0, 24);
      const x = px(p), y = py(p) + 7;
      const w = txt.length * 11.2 + 10, h = 27;
      let end = x > W*0.6;
      let bx0 = end ? x - 20 - w : x + 20;
      let box = {x0:bx0, x1:bx0+w, y0:y-h*0.8, y1:y+h*0.3};
      if(hit(box) || box.x1 > W || box.x0 < 0){
        end = !end;
        bx0 = end ? x - 20 - w : x + 20;
        box = {x0:bx0, x1:bx0+w, y0:y-h*0.8, y1:y+h*0.3};
      }
      if(hit(box) || box.x1 > W || box.x0 < 0) return "";
      taken.push(box);
      return `<text x="${(end ? x-20 : x+20).toFixed(1)}" y="${y.toFixed(1)}"
        text-anchor="${end?"end":"start"}"
        font-family="Verdana,Tahoma,sans-serif" font-size="21" font-weight="700"
        fill="var(--ink)" stroke="var(--card)" stroke-width="5" paint-order="stroke"
        >${esc(txt)}</text>`;
    }).join("");

  return `
  ${anchorCard()}
  <div class="maph">
    <svg class="map" id="svgmap" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${line ? `<polyline points="${line}" fill="none" stroke="var(--plan-br)"
        stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"></polyline>` : ""}
      ${dots}
      ${labels}
      <g>
        <line x1="26" y1="${H-26}" x2="${26+barPx}" y2="${H-26}" stroke="var(--ink2)" stroke-width="3"></line>
        <line x1="26" y1="${H-33}" x2="26" y2="${H-19}" stroke="var(--ink2)" stroke-width="3"></line>
        <line x1="${26+barPx}" y1="${H-33}" x2="${26+barPx}" y2="${H-19}" stroke="var(--ink2)" stroke-width="3"></line>
        <text x="${26+barPx/2}" y="${H-38}" text-anchor="middle" font-family="Verdana,Tahoma,sans-serif"
          font-size="20" fill="var(--ink2)">${barM >= 1000 ? (barM/1000)+" km" : barM+" m"}</text>
      </g>
    </svg>
    <div class="legend">
      <span><i class="dot plan"></i>on the plan</span>
      <span><i class="dot yes"></i>a yes</span>
      <span><i class="dot may"></i>a maybe</span>
      <span><i class="dot me"></i>measuring from</span>
      <span>dashed ring = must-do</span>
      <span>faded dot on the edge = further out that way</span>
    </div>
  </div>
  <div class="foot">Positions are true to scale and north is up, but there is no map
  underneath on purpose, so this still draws with no signal. Tap any dot.</div>`;
}

/* ------------------------------------------------- ALL PICKS */
function viewAll(){
  const groups = {};
  for(const s of pickItems()){
    const g = s.city || "Other";
    (groups[g] = groups[g] || []).push(s);
  }
  const order = ["Tokyo","Tokyo Day Trips","Kyoto","Osaka","Nara","Outside Major Cities"];
  const keys = Object.keys(groups).sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  return `
  ${anchorCard()}
  <div class="filters">${
    FILTERS.filter(f => f[0] !== "plan")
      .map(f => `<button class="f${state.filter===f[0]?" on":""}" data-f="${f[0]}">${esc(f[1])}</button>`).join("")
  }</div>
  ${keys.map(k => {
    const list = sortByAnchor(groups[k].filter(passFilter));
    if(!list.length) return "";
    return `<div class="sechead"><h2>${esc(k)}</h2><span class="n">${list.length}</span></div>
      <div class="card">${list.map(s => pickRow(s, {planDays:(s.days||[])})).join("")}</div>`;
  }).join("")}
  <div class="foot">Every spot either of you marked yes or maybe in the trip planner:
  ${SPOTS.length} in total.</div>`;
}

/* ---------------------------------------------------------------- sheet */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
scrim.addEventListener("click", closeSheet);

function mapsHref(it){
  if(it.lat == null) return "https://www.google.com/maps/search/" + encodeURIComponent(it.name + " Japan");
  return "https://www.google.com/maps/search/?api=1&query=" + it.lat + "," + it.lng;
}
function openSheet(it, kind){
  let onPlanDay = 0;
  if(it._t === "stop"){
    onPlanDay = it._day || state.day;
    const sp = it.poolkey ? SPOT_BY_KEY.get(it.poolkey) : null;
    if(sp){
      // keep the itinerary's wording and pin, borrow the votes and the note
      it = Object.assign({}, it, {
        b:sp.b, j:sp.j, bm:sp.bm, jm:sp.jm,
        note: it.note || sp.note, area: it.area || sp.area,
        city: it.city || sp.city, cat: it.cat || sp.cat, days: sp.days
      });
    }
  }
  const m = state.anchor ? metres(state.anchor, it) : null;
  const chips =
      (onPlanDay ? `<span class="vc plan">on day ${onPlanDay} plan</span>` : "")
    + (it.b !== undefined
        ? voteChips(it).map(c => `<span class="vc ${c[0]}">${esc(c[1])}</span>`).join("")
        : "");
  const links = it.links || {};
  const L = [];
  if(it.lat != null || it.name) L.push(["Open in Google Maps", mapsHref(it)]);
  if(links.google) L.push(["Google it", links.google]);
  if(links.tiktok) L.push(["TikTok", links.tiktok]);
  if(links.youtube) L.push(["YouTube", links.youtube]);

  const where = metaLine([it.area, it.city, it.cat], false);

  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="pad">
      <h3>${esc(it.name)}</h3>
      ${where ? `<div class="where">${esc(where)}</div>` : ""}
      <div class="chips" style="margin-top:9px">${chips}
        ${(() => { const dd = (it.days||[]).filter(n => n !== onPlanDay);
            return dd.length ? `<span class="vc plan">listed on day ${dd.join(", ")}</span>` : ""; })()}
        ${it.lat == null ? `<span class="vc flat">no map pin</span>` : ""}
      </div>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
      ${(it.details && it.details.length)
        ? `<ul class="details" style="margin-top:10px">${it.details.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>` : ""}
      <div class="kv">
        ${m != null ? `<div class="kvi"><div class="k">From where you're measuring</div>
          <div class="v">${esc(travelLabel(m))}</div><div class="k">${esc(distLabel(m))} as the crow flies</div></div>` : ""}
        ${it.lat != null ? `<div class="kvi"><div class="k">Coordinates</div>
          <div class="v" style="font-size:13px">${it.lat.toFixed(5)}, ${it.lng.toFixed(5)}</div></div>` : ""}
      </div>
      ${it.address ? `<div class="addr">${esc(it.address)}</div>` : ""}
      <div class="btns">
        ${it.lat != null ? `<button class="btn primary" id="setAnchor">◉ I'm here, measure from this</button>` : ""}
        <button class="btn sm" id="closeSheet">Close</button>
      </div>
      ${L.length ? `<div class="linkwrap">
        <div class="cap">These open the internet, so they need wifi or data</div>
        <div class="btns">${L.map(l =>
          `<a class="btn sm" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`
        ).join("")}</div>
      </div>` : ""}
    </div>`;
  sheet.classList.add("on"); scrim.classList.add("on"); sheet.scrollTop = 0;

  const sa = sheet.querySelector("#setAnchor");
  if(sa) sa.addEventListener("click", () => {
    stopGps();
    state.anchor = {
      lat:it.lat, lng:it.lng, label:it.name,
      sub:"You said you're standing here", kind:"spot", ref:it._id
    };
    save(); closeSheet(); render();
  });
  sheet.querySelector("#closeSheet").addEventListener("click", closeSheet);
}

function findStop(id){
  for(const d of DAYS){
    const items = planItems(d);
    const hit = items.find(s => s._id === id);
    if(hit) return hit;
  }
  return null;
}
function findPick(id){
  const s = SPOTS.find(x => x.id === id);
  return s ? Object.assign({}, s, {_t:"pick", _id:s.id}) : null;
}

/* ---------------------------------------------------------------- gps */
function stopGps(){
  if(state.gpsWatch != null){ navigator.geolocation.clearWatch(state.gpsWatch); state.gpsWatch = null; }
}
function startGps(){
  if(!navigator.geolocation){
    state.gpsErr = "This browser will not give out a location.";
    render(); return;
  }
  state.gpsErr = "Looking for satellites. With no data this can take up to a minute.";
  render();
  state.gpsWatch = navigator.geolocation.watchPosition(pos => {
    state.gpsErr = "";
    state.anchor = {
      lat:pos.coords.latitude, lng:pos.coords.longitude,
      label:"My location",
      sub:"Accurate to about " + Math.round(pos.coords.accuracy) + " m",
      kind:"gps", ref:"__me"
    };
    render();
  }, err => {
    stopGps();
    state.gpsErr = err.code === 1
      ? "Location is turned off for this app. Settings, then Safari, then Location."
      : "Could not get a fix. Step outside, or tap a stop below instead.";
    render();
  }, {enableHighAccuracy:true, timeout:60000, maximumAge:15000});
}

/* ---------------------------------------------------------------- wiring */
function render(){
  writeHash();
  renderStrip();
  main.innerHTML =
      state.tab === "plan" ? viewPlan()
    : state.tab === "near" ? viewNear()
    : state.tab === "map"  ? viewMap()
    :                        viewAll();
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.tab === state.tab));
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if(tab){ state.tab = tab.dataset.tab; window.scrollTo(0,0); render(); return; }

  const chip = e.target.closest(".chip");
  if(chip){ state.day = +chip.dataset.day; save(); window.scrollTo(0,0); render(); return; }

  if(e.target.closest("#todayBtn")){ state.day = TODAY; save(); render(); return; }
  if(e.target.closest("#gpsBtn")){
    if(state.anchor && state.anchor.kind === "gps"){ stopGps(); state.anchor = null; save(); render(); }
    else startGps();
    return;
  }
  if(e.target.closest("#clearAnchor")){ stopGps(); state.anchor = null; save(); render(); return; }

  const f = e.target.closest(".f");
  if(f){ state.filter = f.dataset.f; save(); render(); return; }

  const pt = e.target.closest(".pt");
  if(pt){
    if(pt.dataset.stop){ const s = findStop(pt.dataset.stop); if(s) openSheet(s); }
    else if(pt.dataset.pick){ const s = findPick(pt.dataset.pick); if(s) openSheet(s); }
    return;
  }
  const rowStop = e.target.closest("[data-stop]");
  if(rowStop && !rowStop.classList.contains("pt")){
    const s = findStop(rowStop.dataset.stop); if(s) openSheet(s); return;
  }
  const rowPick = e.target.closest("[data-pick]");
  if(rowPick && !rowPick.classList.contains("pt")){
    const s = findPick(rowPick.dataset.pick); if(s) openSheet(s); return;
  }
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
