<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Japan Day Board</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japan">
<meta name="theme-color" content="#eef3f8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
/* Light theme is pinned on purpose: Brett's phone and desktop both run dark,
   and this needs to stay a high-contrast light surface wherever it opens. */
:root{
  color-scheme: light;
  --paper:#f8f6f1;
  --ground:#e7eef6;
  --card:#fffdf8;
  --ink:#1c262e;
  --ink2:#4d5b67;
  --ink3:#79868f;
  --line:#d4dce4;
  --line2:#c0ccd6;

  --yes-fg:#1f6b41; --yes-bg:#daeee1; --yes-br:#9ccfb1;
  --may-fg:#7a5a06; --may-bg:#f8eecb; --may-br:#ddc27a;
  --plan-fg:#15527f; --plan-bg:#d6e7f4; --plan-br:#96c0dd;
  --must-fg:#9a3c18; --must-bg:#fadfd4; --must-br:#e8ab8e;
  --me-fg:#5b2d82;  --me-bg:#ebdff5;  --me-br:#c3a3dd;

  --r:14px;
  --tap:48px;
  --shadow:0 1px 0 var(--line2), 0 2px 10px rgba(28,38,46,.055);
  --font:Verdana,Tahoma,Geneva,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);background:var(--ground);color:var(--ink);
  font-size:16px;line-height:1.5;letter-spacing:.005em;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--plan-fg);text-decoration:none}          /* no underlines, by preference */
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}

/* ---------------------------------------------------------------- header */
header{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 12px rgba(28,38,46,.06);
}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;max-width:720px;margin:0 auto}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--ink3);font-weight:400}
.today-btn{
  margin-left:auto;background:var(--plan-bg);color:var(--plan-fg);
  border:1px solid var(--plan-br);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:700;min-height:36px;
}
.today-btn[hidden]{display:none}

/* day strip */
.strip{display:flex;gap:7px;overflow-x:auto;padding:2px 12px 10px;max-width:720px;margin:0 auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;scroll-snap-align:center;
  min-width:52px;padding:6px 9px 7px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);
  text-align:center;line-height:1.2;
}
.chip b{display:block;font-size:16px}
.chip i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);margin-top:1px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on i{color:#c3ced7}
.chip.now{border-color:var(--must-br);border-width:2px}
.chip.jump{background:var(--plan-bg);border-color:var(--plan-br);color:var(--plan-fg);
  min-width:62px}
.chip.jump i{color:var(--plan-fg);opacity:.75}

/* ---------------------------------------------------------------- tabs
   These sit at the TOP: at the bottom they read as chrome and got missed. */
nav.tabs{background:var(--paper)}
.tabs-in{display:flex;gap:5px;max-width:720px;margin:0 auto;padding:4px 12px 9px}
.tab{
  flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;
  gap:6px;font-size:13px;color:var(--ink2);font-weight:700;border-radius:11px;
  background:var(--card);border:1px solid var(--line);padding:0 4px;line-height:1.15;
}
.tab em{font-style:normal;font-size:15px;line-height:1}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:active{background:var(--ground)}
.tab.on:active{background:var(--ink)}

/* ---------------------------------------------------------------- cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.pad{padding:13px 14px}
.dayhead .eyebrow{font-size:12px;color:var(--ink3);font-weight:700}
.dayhead h1{font-size:22px;margin:3px 0 0;line-height:1.2}
.dayhead .sub{font-size:13.5px;color:var(--ink2);margin-top:5px}
.hotel{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);
  border-top:1px dashed var(--line2);margin-top:11px;padding-top:10px}

.sechead{display:flex;align-items:baseline;gap:8px;margin:20px 2px 7px}
.sechead h2{font-size:15px}
.sechead .n{font-size:12px;color:var(--ink3);font-weight:700}

/* ---------------------------------------------------------------- rows */
.row{display:flex;flex-direction:column;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.anchored{background:var(--me-bg)}
.rtop{display:flex;align-items:stretch;width:100%}
/* the doc prints "Google · TikTok · YouTube" after each entry, so keep them on
   the row rather than burying them one tap deeper */
.rfoot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;
  padding:0 10px 9px 44px;margin-top:-3px}
.row.sub .rfoot{padding-left:54px}
.rfoot a{font-size:11px;color:var(--plan-fg);padding:3px 6px;border-radius:6px;
  background:var(--plan-bg);border:1px solid var(--plan-br);margin-right:4px;
  line-height:1.25;white-space:nowrap}
.rfoot a:active{background:var(--plan-br)}

/* drag handle */
.grab{flex:0 0 34px;display:flex;align-items:flex-start;justify-content:center;
  padding-top:12px;font-size:19px;line-height:1;color:var(--line2);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grab:active{cursor:grabbing;color:var(--ink2)}
.row.dragging{box-shadow:0 8px 22px rgba(28,38,46,.22);border-radius:10px;
  background:var(--card);opacity:.97}
.row.drop-above{box-shadow:inset 0 3px 0 0 var(--plan-fg)}
.row.drop-below{box-shadow:inset 0 -3px 0 0 var(--plan-fg)}
body.dragging-now{user-select:none;-webkit-user-select:none}
body.dragging-now .rmain{pointer-events:none}

/* shading, inside the card only: the itinerary is locked in, picks are not */
.shadepick{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.shadepick .cap{font-size:11.5px;color:var(--ink3);margin-bottom:7px}
.shaderow{display:flex;gap:7px}
.shbtn{flex:1;min-height:46px;border-radius:11px;font-size:13px;font-weight:700;
  border:2px solid;padding:6px 4px;line-height:1.2}
.shbtn.sh-g{background:#e8f5ed;border-color:#9ccfb1;color:#1d5e39}
.shbtn.sh-y{background:#fcf5de;border-color:#ddc27a;color:#7a5a06}
.shbtn.sh-r{background:#fceae1;border-color:#e8ab8e;color:#8f3f22}
.shbtn.sh-g.on{background:#2a7c4f;border-color:#2a7c4f;color:#fff}
.shbtn.sh-y.on{background:#9b7a16;border-color:#9b7a16;color:#fff}
.shbtn.sh-r.on{background:#b2502c;border-color:#b2502c;color:#fff}

/* shaded rows */
.row.sh-g{background:#e8f5ed}
.row.sh-y{background:#fcf5de}
.row.sh-r{background:#fceae1}
.row.sh-g .rname{color:#1d5e39}
.row.sh-r .rname{color:#8f3f22}
.rmain{
  display:flex;gap:11px;align-items:flex-start;flex:1;min-width:0;text-align:left;
  padding:12px 4px 12px 14px;min-height:var(--tap);
}
.rmain:active{background:var(--ground)}
.rx{
  flex:0 0 42px;display:flex;align-items:flex-start;justify-content:center;
  padding-top:13px;font-size:17px;line-height:1;color:var(--ink3);
}
.rx:active{color:var(--must-fg)}
.row.gone{opacity:.5}
.row.gone .rname{text-decoration:line-through}
.marker{flex:0 0 26px;height:26px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;margin-top:1px;
  background:var(--ground);color:var(--ink2);border:1px solid var(--line2)}
.marker.plan{background:var(--plan-bg);color:var(--plan-fg);border-color:var(--plan-br)}
.marker.yes{background:var(--yes-bg);color:var(--yes-fg);border-color:var(--yes-br)}
.marker.may{background:var(--may-bg);color:var(--may-fg);border-color:var(--may-br)}
.marker.me{background:var(--me-bg);color:var(--me-fg);border-color:var(--me-br)}
.rbody{flex:1;min-width:0}
.rname{font-size:15.5px;font-weight:700;line-height:1.3}
.row.sub .rname{font-size:14.5px;font-weight:400}
.row.sub .rmain{padding-left:38px}
.row.trans .rname,.row.note .rname{font-weight:400;color:var(--ink2);font-size:14px}
.rmeta{font-size:12.5px;color:var(--ink3);margin-top:3px}
.rnear{display:block;font-size:12px;color:var(--ink2);margin-top:6px;
  background:var(--ground);border-radius:9px;padding:7px 9px;line-height:1.4}
.rnear .nh{display:block;font-size:10.5px;color:var(--ink3);font-weight:700;
  margin-bottom:3px}
.rnear .nr{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.rnear .ni{flex:0 0 14px;color:var(--ink3);font-size:10.5px;font-weight:700}
.rnear b{color:var(--ink)}
.rnear .dd{color:var(--ink3);margin-left:auto;white-space:nowrap;font-size:11px}
.rdist{flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--ink2);font-weight:700;
  margin-top:2px;line-height:1.35;white-space:nowrap}
.rdist i{display:block;font-style:normal;font-weight:400;color:var(--ink3);font-size:11px}
.details{margin:5px 0 0;padding:0;list-style:none}
.details li{font-size:12.5px;color:var(--ink2);padding-left:11px;position:relative;margin-top:2px}
.details li:before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--line2)}

/* vote chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vc{font-size:11.5px;font-weight:700;padding:2.5px 7px;border-radius:7px;border:1px solid}
.vc.yes{background:var(--yes-bg);color:var(--yes-fg);border-color:var(--yes-br)}
.vc.may{background:var(--may-bg);color:var(--may-fg);border-color:var(--may-br)}
.vc.must{background:var(--must-bg);color:var(--must-fg);border-color:var(--must-br)}
.vc.plan{background:var(--plan-bg);color:var(--plan-fg);border-color:var(--plan-br)}
.vc.flat{background:var(--ground);color:var(--ink2);border-color:var(--line2);font-weight:400}

/* ---------------------------------------------------------------- anchor bar */
.anchor{
  background:var(--me-bg);border:1px solid var(--me-br);border-radius:var(--r);
  padding:11px 13px;margin:12px 0;box-shadow:var(--shadow);
}
.anchor .lbl{font-size:12px;color:var(--me-fg);font-weight:700}
.anchor .val{font-size:15.5px;font-weight:700;margin-top:3px;line-height:1.3}
.anchor .hint{font-size:12px;color:var(--ink2);margin-top:4px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  min-height:42px;padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{background:var(--ground)}
.btn.primary{background:var(--plan-fg);border-color:var(--plan-fg);color:#fff}
.btn.sm{min-height:36px;padding:7px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45}

/* filters */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--card);border:1px solid var(--line);min-height:38px}
.f.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------------------------------------------------------------- map */
.maph{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
svg.map{display:block;width:100%;height:auto;background:
  radial-gradient(circle at 30% 20%, #f2f7fc 0%, #e7eef6 60%, #dfe8f1 100%)}
.legend{display:flex;flex-wrap:wrap;gap:9px;padding:11px 13px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid}
.dot.plan{background:var(--plan-bg);border-color:var(--plan-fg)}
.dot.yes{background:var(--yes-bg);border-color:var(--yes-fg)}
.dot.may{background:var(--may-bg);border-color:var(--may-fg)}
.dot.me{background:var(--me-bg);border-color:var(--me-fg)}

/* ---------------------------------------------------------------- sheet */
.scrim{position:fixed;inset:0;background:rgba(20,28,34,.42);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.25,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(20,28,34,.26);
  -webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.grab{width:42px;height:4px;border-radius:999px;background:var(--line2);margin:9px auto 2px}
.sheet .pad{padding:8px 18px 0}
.sheet h3{font-size:20px;line-height:1.25}
.sheet .where{font-size:13px;color:var(--ink3);margin-top:4px}
.sheet .note{font-size:14px;color:var(--ink2);margin-top:10px;background:var(--ground);
  border-radius:10px;padding:9px 11px}
.sheet .addr{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.45}
.kv{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.kvi{flex:1 1 44%;background:var(--ground);border-radius:11px;padding:9px 11px;min-width:130px}
.kvi .k{font-size:11px;color:var(--ink3);font-weight:700}
.kvi .v{font-size:16px;font-weight:700;margin-top:2px}
.linkwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.linkwrap .cap{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
/* "what else is right here" list, inside the spot card */
.nearblk{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.nearblk .cap{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.catchips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.cc{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;
  background:var(--card);border:1px solid var(--line2);color:var(--ink2);min-height:30px}
.cc.on{background:var(--ink);border-color:var(--ink);color:#fff}
.prov{font-size:11.5px;color:var(--ink2);background:var(--ground);border-radius:9px;
  padding:8px 10px;margin-top:10px;line-height:1.45}
.prov b{color:var(--ink)}
.prov .warn{color:var(--must-fg);font-weight:700}
.nearrow{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:9px 2px;border-top:1px solid var(--line);min-height:44px}
.nearrow:first-of-type{border-top:0}
.nearrow:active{background:var(--ground)}
.nn{flex:1;min-width:0}
.nname{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.nd{flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:700;color:var(--ink2);
  white-space:nowrap;line-height:1.35}
.nd i{display:block;font-style:normal;font-weight:400;color:var(--ink3);font-size:11px}
.offline-note{font-size:11.5px;color:var(--must-fg);background:var(--must-bg);
  border:1px solid var(--must-br);border-radius:8px;padding:6px 9px;margin-top:9px}

.empty{text-align:center;color:var(--ink3);font-size:14px;padding:26px 18px}
.foot{font-size:11.5px;color:var(--ink3);text-align:center;padding:16px 12px 6px;line-height:1.6}
</style>
</head>
<body>
<header>
  <nav class="tabs">
    <div class="tabs-in">
      <button class="tab on" data-tab="plan"><em>&#9635;</em>Day</button>
      <button class="tab" data-tab="trip"><em>&#9776;</em>Whole trip</button>
      <button class="tab" data-tab="near"><em>&#9678;</em>Nearby</button>
      <button class="tab" data-tab="map"><em>&#9671;</em>Map</button>
    </div>
  </nav>
  <div class="strip" id="strip"></div>
</header>

<main class="wrap" id="main"></main>

<div class="scrim" id="scrim"></div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("tripdata").textContent);
const DAYS = DATA.days, SPOTS = DATA.spots, HOTELS = DATA.hotels || [];

/* ---------------------------------------------------------------- geo math */
const R = 6371000;
function metres(a, b){
  if(!a || !b || a.lat == null || b.lat == null) return null;
  const p = Math.PI/180;
  const dla = (b.lat-a.lat)*p, dlo = (b.lng-a.lng)*p;
  const la1 = a.lat*p, la2 = b.lat*p;
  const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* Straight line, padded for the fact that you cannot walk through buildings.
   1.3x detour on a city grid, 80 m/min is a normal walking pace. */
const DETOUR = 1.3, MPM = 80;
function walkMin(m){ return Math.max(1, Math.round(m*DETOUR/MPM)); }
function distLabel(m){
  if(m == null) return "";
  if(m > 1600) return (m/1000).toFixed(m < 10000 ? 1 : 0) + " km";
  return Math.round(m/10)*10 + " m";
}
function travelLabel(m){
  if(m == null) return "";
  if(m > 2500) return "train";
  return "~" + walkMin(m) + " min";
}

/* ---------------------------------------------------------------- vote model */
const RANK = { yes:2, maybe:1, "":0, no:0 };
function voteChips(s){
  const out = [];
  const b = s.b, j = s.j;
  if(b === "yes" && j === "yes") out.push(["yes","Both yes"]);
  else{
    if(b === "yes") out.push(["yes","Brett yes"]);
    else if(b === "maybe") out.push(["may","Brett maybe"]);
    if(j === "yes") out.push(["yes","Jessa yes"]);
    else if(j === "maybe") out.push(["may","Jessa maybe"]);
  }
  if(s.bm) out.push(["must","Brett must-do"]);
  if(s.jm) out.push(["must","Jessa must-do"]);
  return out;
}
function voteShort(s){
  const b = s.b, j = s.j;
  if(b === "yes" && j === "yes") return "Both yes";
  const p = [];
  if(b === "yes") p.push("B yes"); else if(b === "maybe") p.push("B maybe");
  if(j === "yes") p.push("J yes"); else if(j === "maybe") p.push("J maybe");
  return p.join(" · ") || "no vote";
}
function strength(s){
  // lower sorts first inside an equal-distance tie
  let v = 10 - (RANK[s.b]||0)*2 - (RANK[s.j]||0)*2;
  if(s.bm || s.jm) v -= 3;
  return v;
}
function markerClass(s){
  if(s.b === "yes" || s.j === "yes") return "yes";
  return "may";
}
/* area / city / category, with repeats dropped: the sheet often files a spot under
   an area that is just its city or its own category again. */
function metaLine(parts, noPin){
  const seen = new Set(), out = [];
  for(const p of parts){
    const v = (p || "").trim();
    if(!v) continue;
    const k = v.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(v);
  }
  if(noPin) out.push("no map pin");
  return out.join(" · ");
}

/* ---------------------------------------------------------------- state */
const LS = "jdb.v1";
const state = {
  tab:"plan",
  day:1,
  anchor:null,          // {lat,lng,label,sub,kind:'gps'|'spot'}
  filter:"all",
  nearCat:"",
  openItem:null,
  gpsWatch:null,
  gpsErr:"",
};
try{
  const saved = JSON.parse(localStorage.getItem(LS) || "{}");
  if(saved.day) state.day = saved.day;
  if(saved.filter) state.filter = saved.filter;
  if(saved.anchor && saved.anchor.kind === "spot") state.anchor = saved.anchor;
}catch(e){}
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      day:state.day, filter:state.filter,
      anchor: state.anchor && state.anchor.kind === "spot" ? state.anchor : null
    }));
  }catch(e){}
}

/* ---------------------------------------------------------------- removals
   Taking something off the board hides it everywhere, but never deletes it:
   ids are content-stable so a rebuild keeps your choices, and every view has a
   "Taken off" drawer at the bottom to put things back. */
const LS_GONE = "jdb.removed.v1";
let GONE = new Set();
try{ GONE = new Set(JSON.parse(localStorage.getItem(LS_GONE) || "[]")); }catch(e){}
function saveGone(){
  try{ localStorage.setItem(LS_GONE, JSON.stringify([...GONE])); }catch(e){}
}
function isGone(id){ return GONE.has(id); }

/* ---------------------------------------------------------------- shading
   Green = we're doing this. Amber = undecided. Red = not keen.
   Kept separate from removal: shading is the everyday judgement, ✕ is the rare one. */
const LS_MARK = "jdb.mark.v1";
let MARK = {};
try{ MARK = JSON.parse(localStorage.getItem(LS_MARK) || "{}") || {}; }catch(e){}
function saveMark(){ try{ localStorage.setItem(LS_MARK, JSON.stringify(MARK)); }catch(e){} }
function markOf(id){ return MARK[id] || ""; }
function setMark(id, v){
  if(MARK[id] === v) delete MARK[id]; else MARK[id] = v;   // tapping again clears it
  saveMark(); render();
}

/* ---------------------------------------------------------------- ordering
   Manual order for the "Other yes / maybe" block, per day. Anything not yet
   moved keeps the document's original order. */
const LS_ORDER = "jdb.order.v1";
let ORDER = {};
try{ ORDER = JSON.parse(localStorage.getItem(LS_ORDER) || "{}") || {}; }catch(e){}
function saveOrder(){ try{ localStorage.setItem(LS_ORDER, JSON.stringify(ORDER)); }catch(e){} }
function applyOrder(dayN, ids){
  const saved = ORDER[dayN];
  if(!saved || !saved.length) return ids;
  const pos = new Map(saved.map((id, i) => [id, i]));
  return ids.slice().sort((a, b) => {
    const pa = pos.has(a) ? pos.get(a) : 1e6 + ids.indexOf(a);
    const pb = pos.has(b) ? pos.get(b) : 1e6 + ids.indexOf(b);
    return pa - pb;
  });
}
function movePick(dayN, ids, id, dir){
  const cur = applyOrder(dayN, ids).slice();
  const i = cur.indexOf(id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= cur.length) return;
  cur.splice(j, 0, cur.splice(i, 1)[0]);
  ORDER[dayN] = cur;
  saveOrder(); render();
}
function remove(id){ GONE.add(id); saveGone(); closeSheet(); render(); }
function restore(id){ GONE.delete(id); saveGone(); closeSheet(); render(); }

function todayDay(){
  const now = new Date();
  const iso = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0")
            + "-" + String(now.getDate()).padStart(2,"0");
  const hit = DAYS.find(d => d.date === iso);
  if(hit) return hit.n;
  if(iso < DAYS[0].date) return 1;
  if(iso > DAYS[DAYS.length-1].date) return DAYS.length;
  return 1;
}
const TODAY = todayDay();
if(!sessionStorage.getItem("jdb.opened")){
  state.day = TODAY;
  sessionStorage.setItem("jdb.opened","1");
}

/* #day=3&tab=near keeps the iPhone back button working and makes any view linkable */
function readHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/,""));
  const d = +h.get("day");
  if(d >= 1 && d <= DAYS.length) state.day = d;
  const t = h.get("tab");
  if(["plan","trip","near","map"].includes(t)) state.tab = t;
}
function writeHash(){
  const want = "#day=" + state.day + "&tab=" + state.tab;
  if(location.hash !== want) history.replaceState(null, "", want);
}
readHash();
window.addEventListener("hashchange", () => { readHash(); render(); });

function day(){ return DAYS.find(d => d.n === state.day) || DAYS[0]; }
function hotelFor(d){
  return HOTELS.find(h => d.date >= h.in && d.date < h.out) || null;
}

/* every pinnable thing, with a consistent shape */
function planItems(d){
  return d.stops.map(s => Object.assign({}, s, { _t:"stop", _day:d.n }));
}
function pickItems(){
  return SPOTS.map(s => Object.assign({}, s, { _t:"pick" }));
}
/* live = not taken off the board */
function livePlan(d){ return planItems(d).filter(s => !isGone(s.id)); }
function livePicks(){ return pickItems().filter(s => !isGone(s.id)); }

/* ---------------------------------------------------------------- escaping */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ---------------------------------------------------------------- render */
const main = document.getElementById("main");

function renderStrip(){
  const el = document.getElementById("strip");
  // the whole-trip view carries its own jump bar, so two strips would stack
  el.style.display = state.tab === "trip" ? "none" : "";
  if(state.tab === "trip") return;
  const back = state.day !== TODAY
    ? `<button class="chip jump" data-day="${TODAY}"><b>Today</b><i>day ${TODAY}</i></button>`
    : "";
  el.innerHTML = back + DAYS.map(d => {
    const wd = d.weekday.slice(0,3);
    return `<button class="chip${d.n===state.day?" on":""}${d.n===TODAY?" now":""}" data-day="${d.n}">
      <b>${d.n}</b><i>${esc(wd)}</i></button>`;
  }).join("");
  const on = el.querySelector(".chip.on");
  if(on) on.scrollIntoView({block:"nearest", inline:"center"});
}

function anchorCard(){
  const a = state.anchor;
  const gpsOn = a && a.kind === "gps";
  return `<div class="anchor">
    <div class="lbl">Measuring from</div>
    <div class="val">${a ? esc(a.label) : "Nothing picked yet"}</div>
    <div class="hint">${
      a ? esc(a.sub || "") :
      "Tap any stop below, or use your location, and everything gets sorted by how far it is from there."
    }</div>
    <div class="btns">
      <button class="btn ${gpsOn?"":"primary"}" id="gpsBtn">
        ${gpsOn ? "◉ Using my location" : "◎ Use my location"}
      </button>

    </div>

  </div>`;
}

function distCell(item){
  if(!state.anchor || item.lat == null) return "";
  const m = metres(state.anchor, item);
  if(m == null) return "";
  if(m < 40) return `<div class="rdist">here<i>&nbsp;</i></div>`;
  return `<div class="rdist">${esc(travelLabel(m))}<i>${esc(distLabel(m))}</i></div>`;
}

function stopRow(s, idx){
  const cls = s.kind === "transit" ? "trans" : s.kind === "note" ? "note" : "";
  const sub = s.depth >= 1 ? " sub" : "";
  const anchored = state.anchor && state.anchor.ref === s.id ? " anchored" : "";
  let mk = s.kind === "stop" ? "plan" : "";
  let glyph = s.kind === "transit" ? "→" : s.kind === "note" ? "·" : String(idx);
  if(anchored){ mk = "me"; glyph = "◉"; }
  const det = (s.details || []).length
    ? `<ul class="details">${s.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : "";
  // No votes and no shading on itinerary rows: these are locked in, we are doing them.
  const meta = metaLine([s.cat], s.lat == null && s.kind === "stop");
  const chips = "";
  return `<div class="row ${cls}${sub}${anchored}">
    <div class="rtop">
      <button class="rmain" data-stop="${esc(s.id)}">
        <span class="marker ${mk}">${glyph}</span>
        <span class="rbody">
          <span class="rname">${esc(s.name)}</span>
          ${meta ? `<span class="rmeta">${esc(meta)}</span>` : ""}
          ${chips ? `<span class="chips">${chips}</span>` : ""}
          ${det}
        </span>

      </button>
      <button class="rx" data-del="${esc(s.id)}" aria-label="Take off the board">✕</button>

}

/* Inline search links. They need the internet, so they are plainly marked as
   search links and simply fail to load when there is no signal. */
const MARKS = [["g","doing it"],["y","undecided"],["r","not keen"]];

function moveBar(dayN, id){
  // a handle you grab and drag, rather than tapping an arrow repeatedly
  return `<span class="grab" data-grab="${esc(id)}" data-gday="${dayN}"
     aria-label="Drag to reorder" title="Drag to reorder">⠿</span>`;
}

function linkBar(it){
  const L = it.links || {};
  const out = [];
  if(it.lat != null) out.push(["Maps", mapsHref(it)]);
  if(L.google)    out.push(["Google", L.google]);
  if(L.tiktok)    out.push(["TikTok", L.tiktok]);
  if(L.instagram) out.push(["Instagram", L.instagram]);
  if(L.youtube)   out.push(["YouTube", L.youtube]);
  return out.map(l =>
    `<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join("");
}

/* the strip under each row: shading, optional reorder, then the search links */
function rowFoot(it){
  return `<div class="rfoot">${linkBar(it)}</div>`;
}

function goneRow(item){
  return `<div class="row gone"><div class="rtop">
    <button class="rmain" data-open-gone="${esc(item.id)}">
      <span class="marker">↺</span>
      <span class="rbody"><span class="rname">${esc(item.name)}</span></span>
    </button>
    <button class="rx" data-restore="${esc(item.id)}" aria-label="Put it back">↺</button>
  </div></div>`;
}

function goneSection(items){
  const list = items.filter(x => isGone(x.id));
  if(!list.length) return "";
  return `<div class="sechead"><h2>Taken off</h2><span class="n">${list.length}</span></div>
    <div class="card">${list.map(goneRow).join("")}</div>`;
}

/* Which itinerary stop is this pick closest to, anywhere in the trip?
   Answers "when does it make sense to do this" without opening anything. */
const NEAREST_STOP = new Map();
const NEAR_MAX_MIN = 60;    // an hour out, past that it is a different day's problem
const NEAR_SHOW = 4;

function nearestStops(p){
  if(p.lat == null) return [];
  if(NEAREST_STOP.has(p.id)) return NEAREST_STOP.get(p.id);
  const hits = [];
  for(const d of DAYS){
    for(const st of d.stops){
      if(st.lat == null || st.kind === "note") continue;
      if(st.poolkey && st.poolkey === p.key) continue;    // it IS this place
      const m = metres(p, st);
      if(m == null) continue;
      if(walkMin(m) > NEAR_MAX_MIN) continue;             // too far to be useful
      hits.push({m, name: st.name, day: d.n});
    }
  }
  hits.sort((a, b) => a.m - b.m);
  const out = hits.slice(0, NEAR_SHOW);
  NEAREST_STOP.set(p.id, out);
  return out;
}

function nearestStopLine(p){
  const list = nearestStops(p);
  if(!list.length) return "";
  return `<span class="rnear">
    <span class="nh">Closest stops on the itinerary</span>
    ${list.map((n, i) => `<span class="nr">
      <span class="ni">${i + 1}</span>
      <b>${esc(n.name)}</b>
      <span class="dd">day ${n.day} · ${esc(travelLabel(n.m))} · ${esc(distLabel(n.m))}</span>
    </span>`).join("")}
  </span>`;
}

function pickRow(s, opts){
  opts = opts || {};
  const chips = voteChips(s).map(c => `<span class="vc ${c[0]}">${esc(c[1])}</span>`).join("");
  const days = (opts.planDays || []).filter(n => n !== s._today);
  const onPlan =
      (s._today ? `<span class="vc plan">on today's plan</span>` : "")
    + (days.length ? `<span class="vc plan">listed day ${days.join(", ")}</span>` : "");
  const anchored = state.anchor && state.anchor.ref === s.id ? " anchored" : "";
  const meta = metaLine([s.area, s.city, s.cat], s.lat == null);
  const sh = markOf(s.id) ? " sh-" + markOf(s.id) : "";
  return `<div class="row${anchored}${sh}" data-rowid="${esc(s.id)}"
      ${opts.reorderDay ? `data-rowday="${opts.reorderDay}"` : ""}>
    <div class="rtop">
      <button class="rmain" data-pick="${esc(s.id)}">
        <span class="marker ${anchored?"me":markerClass(s)}">${anchored?"◉":"★"}</span>
        <span class="rbody">
          <span class="rname">${esc(s.name)}</span>
          <span class="rmeta">${esc(meta)}</span>
          <span class="chips">${chips}${onPlan}</span>
          ${nearestStopLine(s)}
        </span>
        ${distCell(s)}
      </button>
      ${opts.reorderDay ? moveBar(opts.reorderDay, s.id) : ""}
      <button class="rx" data-del="${esc(s.id)}" aria-label="Take off the board">✕</button>
    </div>
    ${rowFoot(s)}
  </div>`;
}

/* ------------------------------------------------- PLAN */
/* The pick ids currently on screen for a day, in the order they are shown. */
function visiblePickIds(d){
  const onPlanKeys = new Set(
    livePlan(d).filter(s => s.poolkey && SPOT_BY_KEY.has(s.poolkey)).map(s => s.poolkey)
  );
  const live = (d.picks || []).map(id => SPOT_BY_ID.get(id)).filter(Boolean)
    .filter(s => !onPlanKeys.has(s.key) && !isGone(s.id));
  return applyOrder(d.n, live.map(s => s.id));
}

/* One day rendered the way the itinerary document lays it out: the plan in order,
   then that day's "Other yes / maybe" block in the document's own order. */
function dayBlock(d, opts){
  opts = opts || {};
  const h = hotelFor(d);
  const all = planItems(d);
  const items = all.filter(s => !isGone(s.id));
  let n = 0;

  const onPlanKeys = new Set(
    items.filter(s => s.poolkey && SPOT_BY_KEY.has(s.poolkey)).map(s => s.poolkey)
  );
  const allPicks = (d.picks || []).map(id => SPOT_BY_ID.get(id)).filter(Boolean)
    .filter(s => !onPlanKeys.has(s.key))
    .map(s => Object.assign({}, s, {_t:"pick"}));
  // manual order wins here; distance sorting lives in Nearby and in the cards
  const live = allPicks.filter(s => !isGone(s.id));
  const byId = new Map(live.map(s => [s.id, s]));
  const picks = applyOrder(d.n, live.map(s => s.id)).map(id => byId.get(id)).filter(Boolean);

  const head = `
  <div class="card dayhead"><div class="pad">
    <div class="eyebrow">Day ${d.n} of ${DAYS.length}${d.n===TODAY?" · today":""}</div>
    <h1>${esc(d.title)}</h1>
    <div class="sub">${esc(d.weekday)}, ${esc(d.label)}${d.city?" · "+esc(d.city):""}</div>
    ${h ? `<div class="hotel"><span>⌂</span><span>Staying at <b>${esc(h.name)}</b>, ${esc(h.city)}</span></div>` : ""}
  </div></div>`;

  const plan = `
  <div class="sechead"><h2>Itinerary</h2>
    <span class="n">${items.length} ${items.length === 1 ? "line" : "lines"}</span></div>
  <div class="card">${
    items.length
      ? items.map(s => { if(s.kind === "stop") n++; return stopRow(s, s.kind==="stop"?n:0); }).join("")
      : `<div class="empty">Nothing left on this day.</div>`
  }</div>`;

  const other = `
  <div class="sechead"><h2>Other yes / maybe</h2><span class="n">${picks.length}</span></div>
  <div class="card">${
    picks.length ? picks.map(s => pickRow(s, {reorderDay: d.n})).join("")
                 : `<div class="empty">Nothing else listed for this day.</div>`
  }</div>`;

  const gone = goneSection(all.concat(allPicks));

  return head + (opts.anchor === false ? "" : anchorCard()) + plan + other + gone;
}

function viewPlan(){
  const d = day();
  return dayBlock(d) + `
  <div class="foot">
    Walk times are straight-line distance padded 30% for real streets, at 80 m per minute.
    Treat them as a rough guide, not a route.<br>
    Shade a row green, amber or red as you go. ✕ still removes, and anything removed
    waits in "Taken off".<br>
    <a href="check-pins.html">Check where every pin came from</a>
  </div>`;
}

/* ------------------------------------------------- WHOLE TRIP, one page */
function viewTrip(){
  const jump = `<div class="strip" style="padding:0 0 10px">${
    DAYS.map(d => `<button class="chip${d.n===TODAY?" now":""}" data-jump="${d.n}">
      <b>${d.n}</b><i>${esc(d.weekday.slice(0,3))}</i></button>`).join("")

    }</section>`

/* ------------------------------------------------- NEARBY */
const FILTERS = [
  ["all","Everything"],
  ["yes","Yes only"],
  ["must","Must-dos"],
  ["food","Food"],
  ["15","Within 15 min"],
  ["plan","On the plan"],
];
function passFilter(it){
  switch(state.filter){
    case "yes":  return it.b === "yes" || it.j === "yes" || it._t === "stop" || !!it._today;
    case "must": return !!(it.bm || it.jm);
    case "food": return /food|eat|restaurant|cafe|café|dessert|bar|sweets|drink/i
                        .test((it.cat||"") + " " + (it.area||""));
    case "15":   { const m = state.anchor ? metres(state.anchor, it) : null;
                   return m != null && walkMin(m) <= 15; }
    case "plan": return it._t === "stop" || !!it._today;
    default:     return true;
  }
}
function sortByAnchor(list){
  const a = state.anchor;
  return list.slice().sort((x,y) => {
    if(a){
      const mx = metres(a,x), my = metres(a,y);
      if(mx != null && my != null && Math.abs(mx-my) > 5) return mx - my;
      if(mx != null && my == null) return -1;
      if(mx == null && my != null) return 1;
    }
    const sx = x._t === "stop" ? -1 : strength(x), sy = y._t === "stop" ? -1 : strength(y);
    if(sx !== sy) return sx - sy;
    return (x.name||"").localeCompare(y.name||"");
  });
}

const SPOT_BY_KEY = new Map(SPOTS.map(s => [s.key, s]));
const SPOT_BY_ID  = new Map(SPOTS.map(s => [s.id, s]));

/* One row per physical place. A stop that is also a voted spot is dropped in
   favour of the voted spot, which then carries the "on today's plan" tag. */
function mergedPool(d){
  const planned = livePlan(d).filter(s => s.kind === "stop" && s.lat != null);
  const onPlan = new Set();
  const out = [];
  for(const s of planned){
    if(s.poolkey && SPOT_BY_KEY.has(s.poolkey)) onPlan.add(s.poolkey);
    else out.push(s);
  }
  for(const s of livePicks()){
    out.push(onPlan.has(s.key) ? Object.assign({}, s, {_today:d.n}) : s);
  }
  return out;
}

function viewNear(){
  const d = day();
  const pool = mergedPool(d);

  const list = sortByAnchor(pool.filter(passFilter));
  const shown = list.slice(0, 120);

  return `
  ${anchorCard()}
  <div class="filters">${
    FILTERS.map(f => `<button class="f${state.filter===f[0]?" on":""}" data-f="${f[0]}">${esc(f[1])}</button>`).join("")
  }</div>
  <div class="sechead"><h2>${state.anchor ? "Closest first" : "Everything you said yes or maybe to"}</h2>
    <span class="n">${list.length}</span></div>
  <div class="card">${
    shown.length ? shown.map(s =>
      s._t === "stop"
        ? planRowInNear(s, d)
        : pickRow(s, {planDays:(s.days||[])})
    ).join("") : `<div class="empty">Nothing matches that filter.</div>`
  }</div>
  ${list.length > shown.length ? `<div class="foot">Showing the nearest ${shown.length} of ${list.length}.</div>` : ""}
  <div class="foot">Stops on today's plan are tagged so you can tell them apart from picks.</div>`;
}
function planRowInNear(s, d){
  const anchored = state.anchor && state.anchor.ref === s._id ? " anchored" : "";
  return `<button class="row${anchored}" data-stop="${esc(s._id)}">
    <span class="marker ${anchored?"me":"plan"}">${anchored?"◉":"■"}</span>
    <span class="rbody">
      <span class="rname">${esc(s.name)}</span>
      <span class="rmeta">${esc(d.city||"")}${s.cat?" · "+esc(s.cat):""}</span>
      <span class="chips"><span class="vc plan">on day ${d.n} plan</span></span>
    </span>
    ${distCell(s)}
  </button>`;
}

/* ------------------------------------------------- MAP (no tiles, works offline) */
function viewMap(){
  const d = day();
  const pts = [];
  const onPlanKeys = new Set();
  for(const s of livePlan(d)){
    if(s.lat == null || s.kind === "note") continue;
    if(s.poolkey && SPOT_BY_KEY.has(s.poolkey)) onPlanKeys.add(s.poolkey);
    pts.push({t:"plan", s});
  }
  const route = pts.map(p => p.s);
  for(const s of livePicks()){
    if(s.lat == null) continue;
    if(onPlanKeys.has(s.key)) continue;       // already drawn as a plan dot
    let best = Infinity;
    for(const r of route){ const m = metres(r,s); if(m != null && m < best) best = m; }
    if((s.days||[]).includes(d.n) || best <= 2500){
      pts.push({t: markerClass(s), s:Object.assign({}, s, {_t:"pick"})});
    }
  }
  if(state.anchor && state.anchor.lat != null){
    pts.push({t:"me", s:Object.assign({}, state.anchor, {name:state.anchor.label, id:"__me"})});
  }
  if(!pts.length){
    return `${anchorCard()}<div class="card"><div class="empty">
      No pinned places for day ${d.n}.</div></div>`;
  }

  /* Frame the day's route, not every pick: one spot 5 km away would otherwise
     squash the whole walk into a thumbprint. Anything outside the frame is still
     drawn, pinned to the edge, so you can see which way it lies. */
  const midLat = pts.reduce((a,p) => a + p.s.lat, 0) / pts.length;
  const kx = Math.cos(midLat*Math.PI/180);
  const X = p => p.s.lng * kx, Y = p => -p.s.lat;

  let fit = pts.filter(p => p.t === "plan" || p.t === "me");
  if(fit.length < 2) fit = pts.slice();
  const cx0 = fit.reduce((a,p) => a + X(p), 0) / fit.length;
  const cy0 = fit.reduce((a,p) => a + Y(p), 0) / fit.length;
  const rad = fit.map(p => Math.hypot(X(p)-cx0, Y(p)-cy0)).sort((a,b) => a-b);
  const cut = rad[Math.max(0, Math.min(rad.length-1, Math.floor(rad.length*0.85)))] * 1.25;
  let keep = fit.filter(p => Math.hypot(X(p)-cx0, Y(p)-cy0) <= cut);
  if(keep.length < 2) keep = fit;

  let x0 = Math.min(...keep.map(X)), x1 = Math.max(...keep.map(X));
  let y0 = Math.min(...keep.map(Y)), y1 = Math.max(...keep.map(Y));
  const MIN = 0.0022;                                  // ~240 m, so one stop is not infinite zoom
  if(x1-x0 < MIN){ const c=(x0+x1)/2; x0=c-MIN/2; x1=c+MIN/2; }
  if(y1-y0 < MIN){ const c=(y0+y1)/2; y0=c-MIN/2; y1=c+MIN/2; }
  const padw = (x1-x0)*0.18, padh = (y1-y0)*0.18;
  x0 -= padw; x1 += padw; y0 -= padh; y1 += padh;

  const W = 1000;
  const H = Math.round(W * Math.max(0.85, Math.min(1.25, (y1-y0)/(x1-x0) || 1)));
  const EDGE = 26;
  const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
  const rawx = p => ((X(p)-x0)/(x1-x0))*W;
  const rawy = p => ((Y(p)-y0)/(y1-y0))*H;
  const px = p => clamp(rawx(p), EDGE, W-EDGE);
  const py = p => clamp(rawy(p), EDGE, H-EDGE);
  const offscreen = p => rawx(p) < EDGE || rawx(p) > W-EDGE
                      || rawy(p) < EDGE || rawy(p) > H-EDGE;

  // scale bar
  const metresPerPx = metres({lat:midLat,lng:x0/kx},{lat:midLat,lng:x1/kx}) / W;
  const targets = [100,200,500,1000,2000,5000];
  const barM = targets.find(t => t/metresPerPx > W*0.14) || 5000;
  const barPx = barM/metresPerPx;

  const COL = {
    plan:["var(--plan-bg)","var(--plan-fg)"],
    yes:["var(--yes-bg)","var(--yes-fg)"],
    may:["var(--may-bg)","var(--may-fg)"],
    me:["var(--me-bg)","var(--me-fg)"],
  };
  const order = {plan:2, yes:1, may:0, me:3};
  pts.sort((a,b) => (order[a.t]||0) - (order[b.t]||0));

  // connect the day's pinned stops in itinerary order
  const line = pts.filter(p => p.t === "plan")
    .map(p => `${px(p).toFixed(1)},${py(p).toFixed(1)}`).join(" ");

  const dots = pts.map(p => {
    const [bg,fg] = COL[p.t] || COL.may;
    const off = offscreen(p);
    const r = (p.t === "me" ? 15 : p.t === "plan" ? 13 : 10) * (off ? 0.72 : 1);
    const must = p.s.bm || p.s.jm;
    const x = px(p).toFixed(1), y = py(p).toFixed(1);
    const attr = p.s.id === "__me" ? "none" : (p.s._t === "stop" ? "stop" : "pick");
    return `<g class="pt" data-${attr}="${esc(p.s.id || "")}">
      <circle cx="${x}" cy="${y}" r="${r+13}" fill="transparent"></circle>
      ${must?`<circle cx="${x}" cy="${y}" r="${(r+5).toFixed(1)}" fill="none"
        stroke="var(--must-fg)" stroke-width="2.5" stroke-dasharray="4 3"></circle>`:""}
      <circle cx="${x}" cy="${y}" r="${r.toFixed(1)}"
        fill="${bg}" stroke="${fg}" stroke-width="3"
        ${off?'stroke-dasharray="3 3" opacity="0.75"':""}></circle>
    </g>`;
  }).join("");

  /* Label the route and the anchor only, and drop any label that would land on
     one already placed: an unreadable pile of names is worse than fewer names. */
  const taken = [];
  const hit = (a) => taken.some(b =>
    !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1));
  const labels = pts
    .filter(p => (p.t === "plan" || p.t === "me") && !offscreen(p))
    .sort((a,b) => (a.t === "me" ? -1 : 0) - (b.t === "me" ? -1 : 0))  // anchor label wins
    .map(p => {
      const txt = (p.s.name || "").slice(0, 24);
      const x = px(p), y = py(p) + 7;
      const w = txt.length * 11.2 + 10, h = 27;
      let end = x > W*0.6;
      let bx0 = end ? x - 20 - w : x + 20;
      let box = {x0:bx0, x1:bx0+w, y0:y-h*0.8, y1:y+h*0.3};
      if(hit(box) || box.x1 > W || box.x0 < 0){
        end = !end;
        bx0 = end ? x - 20 - w : x + 20;
        box = {x0:bx0, x1:bx0+w, y0:y-h*0.8, y1:y+h*0.3};
      }
      if(hit(box) || box.x1 > W || box.x0 < 0) return "";
      taken.push(box);
      return `<text x="${(end ? x-20 : x+20).toFixed(1)}" y="${y.toFixed(1)}"
        text-anchor="${end?"end":"start"}"
        font-family="Verdana,Tahoma,sans-serif" font-size="21" font-weight="700"
        fill="var(--ink)" stroke="var(--card)" stroke-width="5" paint-order="stroke"
        >${esc(txt)}</text>`;
    }).join("");

  return `
  ${anchorCard()}
  <div class="maph">
    <svg class="map" id="svgmap" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${line ? `<polyline points="${line}" fill="none" stroke="var(--plan-br)"
        stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"></polyline>` : ""}
      ${dots}
      ${labels}
      <g>
        <line x1="26" y1="${H-26}" x2="${26+barPx}" y2="${H-26}" stroke="var(--ink2)" stroke-width="3"></line>
        <line x1="26" y1="${H-33}" x2="26" y2="${H-19}" stroke="var(--ink2)" stroke-width="3"></line>
        <line x1="${26+barPx}" y1="${H-33}" x2="${26+barPx}" y2="${H-19}" stroke="var(--ink2)" stroke-width="3"></line>
        <text x="${26+barPx/2}" y="${H-38}" text-anchor="middle" font-family="Verdana,Tahoma,sans-serif"
          font-size="20" fill="var(--ink2)">${barM >= 1000 ? (barM/1000)+" km" : barM+" m"}</text>
      </g>
    </svg>
    <div class="legend">
      <span><i class="dot plan"></i>on the plan</span>
      <span><i class="dot yes"></i>a yes</span>
      <span><i class="dot may"></i>a maybe</span>
      <span><i class="dot me"></i>measuring from</span>
      <span>dashed ring = must-do</span>
      <span>faded dot on the edge = further out that way</span>
    </div>
  </div>
  <div class="foot">Positions are true to scale and north is up, but there is no map
  underneath on purpose, so this still draws with no signal. Tap any dot.</div>`;
}

/* ---------------------------------------------------------------- sheet */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on");
  state.openItem = null; state.nearCat = ""; }
scrim.addEventListener("click", closeSheet);

/* Everything on the board that has a pin: every yes/maybe plus every itinerary
   stop across all 15 days, each one only once. */
function allPinned(){
  const seen = new Set(), out = [];
  for(const s of livePicks()){
    if(s.lat == null) continue;
    seen.add(s.key);
    out.push(s);
  }
  for(const d of DAYS){
    for(const s of livePlan(d)){
      if(s.lat == null || s.kind === "note") continue;
      if(s.poolkey && seen.has(s.poolkey)) continue;   // already in as a pick
      if(s.poolkey) seen.add(s.poolkey);
      out.push(Object.assign({}, s, {_day:d.n}));
    }
  }
  return out;
}

/* "What else is right by this?" ranked nearest first. */
function nearestTo(it, n){
  const out = [];
  for(const c of allPinned()){
    if(c.id === it.id) continue;
    const m = metres(it, c);
    if(m == null) continue;
    out.push({m, c});
  }
  out.sort((a,b) => a.m - b.m);
  return out.slice(0, n || 12);
}

function nearbyBlock(it){
  if(it.lat == null) return "";
  let all = nearestTo(it, 400);
  if(!all.length) return "";

  // category chips, so "what food is near here" is one tap
  const counts = new Map();
  for(const {c} of all){
    const k = (c.cat || "").trim();
    if(k) counts.set(k, (counts.get(k) || 0) + 1);
  }
  const cats = [...counts.entries()].sort((a,b) => b[1]-a[1]).map(x => x[0]);
  const sel = state.nearCat;
  if(sel) all = all.filter(({c}) => (c.cat || "").trim() === sel);
  const list = all.slice(0, 12);

  const chips = `<div class="catchips">
    <button class="cc${sel?"":" on"}" data-cat="">All</button>
    ${cats.map(k => `<button class="cc${sel===k?" on":""}" data-cat="${esc(k)}">${esc(k)}</button>`).join("")}
  </div>`;

  if(!list.length) return `<div class="nearblk"><div class="cap">Closest to here</div>
    ${chips}<div class="empty">Nothing of that type nearby.</div></div>`;

  return `<div class="nearblk">
    <div class="cap">Closest to here, nearest first</div>
    ${chips}
    ${list.map(({m, c}) => {
      const isPick = c._t !== "stop";
      const chips = isPick
        ? voteChips(c).slice(0,2).map(x => `<span class="vc ${x[0]}">${esc(x[1])}</span>`).join("")
        : `<span class="vc plan">day ${c._day} itinerary</span>`;
      const attr = isPick ? "data-pick" : "data-stop";
      return `<button class="nearrow" ${attr}="${esc(c.id)}">
        <span class="nn">
          <span class="nname">${esc(c.name)}</span>
          <span class="chips">${chips}</span>
        </span>
        <span class="nd">${esc(travelLabel(m))}<i>${esc(distLabel(m))}</i></span>
      </button>`;
    }).join("")}
  </div>`;
}

/* Where this pin came from and how much to trust it. No pin is "proven"; the
   address below it is the evidence, and the Maps link checks it in one tap. */
const GEO_SRC = {
  "ROOFTOP":          ["Google geocoder, exact building", "high"],
  "hand-fixed":       ["corrected by hand earlier", "high"],
  "maps":             ["read off Google Maps", "high"],
  "maps-area":        ["Google Maps, area level", "area"],
  "GEOMETRIC_CENTER": ["Google geocoder, centre of a street or block", "area"],
  "APPROXIMATE":      ["Google geocoder, approximate", "area"],
  "partial":          ["planner sheet, confidence not recorded", "unknown"],
  "osm":              ["OpenStreetMap lookup", "high"],
  "sheet":            ["planner sheet", "unknown"],
  "review":           ["flagged for review", "low"],
  "failed":           ["could not be found", "none"],
  "nopin":            ["deliberately not pinned", "none"],
};
function provBlock(it){
  if(it.lat == null){
    return `<div class="prov"><span class="warn">No map pin.</span>
      This one could not be located, so it has no distance anywhere in the app.
      Nothing has been guessed for it.</div>`;
  }
  const g = GEO_SRC[it.geo] || [it.geo || "unknown", "unknown"];
  const warn = (g[1] === "area" || g[1] === "unknown" || g[1] === "low");
  return `<div class="prov">
    <b>Pin source:</b> ${esc(g[0])}${warn ? ` <span class="warn">(worth checking)</span>` : ""}<br>
    <b>Coordinates:</b> ${it.lat.toFixed(5)}, ${it.lng.toFixed(5)}<br>
    ${it.address ? `<b>Resolved address:</b> ${esc(it.address)}` : `<span class="warn">No address recorded.</span>`}
  </div>`;
}

function mapsHref(it){
  if(it.lat == null) return "https://www.google.com/maps/search/" + encodeURIComponent(it.name + " Japan");
  return "https://www.google.com/maps/search/?api=1&query=" + it.lat + "," + it.lng;
}
function openSheet(it, kind){
  let onPlanDay = 0;
  if(it._t === "stop"){
    onPlanDay = it._day || state.day;
    const sp = it.poolkey ? SPOT_BY_KEY.get(it.poolkey) : null;
    if(sp){
      // keep the itinerary's wording and pin, borrow the votes and the note
      it = Object.assign({}, it, {
        b:sp.b, j:sp.j, bm:sp.bm, jm:sp.jm,
        note: it.note || sp.note, area: it.area || sp.area,
        city: it.city || sp.city, cat: it.cat || sp.cat, days: sp.days
      });
    }
  }
  const m = state.anchor ? metres(state.anchor, it) : null;
  const chips =
      (onPlanDay ? `<span class="vc plan">on day ${onPlanDay} plan</span>` : "")
    + (it.b !== undefined
        ? voteChips(it).map(c => `<span class="vc ${c[0]}">${esc(c[1])}</span>`).join("")
        : "");
  const links = it.links || {};
  const L = [];
  if(it.lat != null || it.name) L.push(["Open in Google Maps", mapsHref(it)]);
  if(links.google) L.push(["Google", links.google]);
  if(links.tiktok) L.push(["TikTok", links.tiktok]);
  if(links.instagram) L.push(["Instagram", links.instagram]);
  if(links.youtube) L.push(["YouTube", links.youtube]);

  const where = metaLine([it.area, it.city, it.cat], false);

  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="pad">
      <h3>${esc(it.name)}</h3>
      ${where ? `<div class="where">${esc(where)}</div>` : ""}
      <div class="chips" style="margin-top:9px">${chips}
        ${(() => { const dd = (it.days||[]).filter(n => n !== onPlanDay);
            return dd.length ? `<span class="vc plan">listed on day ${dd.join(", ")}</span>` : ""; })()}
        ${it.lat == null ? `<span class="vc flat">no map pin</span>` : ""}
      </div>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
      ${(it.details && it.details.length)
        ? `<ul class="details" style="margin-top:10px">${it.details.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>` : ""}
      <div class="kv">
        ${m != null ? `<div class="kvi"><div class="k">From where you're measuring</div>
          <div class="v">${esc(travelLabel(m))}</div><div class="k">${esc(distLabel(m))} as the crow flies</div></div>` : ""}
        ${it.lat != null ? `<div class="kvi"><div class="k">Coordinates</div>
          <div class="v" style="font-size:13px">${it.lat.toFixed(5)}, ${it.lng.toFixed(5)}</div></div>` : ""}
      </div>
      ${provBlock(it)}
      ${onPlanDay ? "" : `<div class="shadepick">
        <div class="cap">How keen are we?</div>
        <div class="shaderow">
          ${MARKS.map(([k,label]) => `<button class="shbtn sh-${k}${markOf(it.id)===k?" on":""}"
             data-mark="${k}" data-mid="${esc(it.id)}">${esc(label)}</button>`).join("")}
        </div>
      </div>`}
      <div class="btns">
        ${it.lat != null ? `<button class="btn primary" id="setAnchor">◉ I'm here, measure from this</button>` : ""}
        ${isGone(it.id)
          ? `<button class="btn sm" data-restore="${esc(it.id)}">↺ Put it back</button>`
          : `<button class="btn sm" data-del="${esc(it.id)}">✕ Take it off</button>`}
        <button class="btn sm" id="closeSheet">Close</button>
      </div>
      ${nearbyBlock(it)}
      ${L.length ? `<div class="linkwrap">
        <div class="cap">These open the internet, so they need wifi or data</div>
        <div class="btns">${L.map(l =>
          `<a class="btn sm" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`
        ).join("")}</div>
      </div>` : ""}
    </div>`;
  state.openItem = it;
  sheet.classList.add("on"); scrim.classList.add("on");

  const sa = sheet.querySelector("#setAnchor");
  if(sa) sa.addEventListener("click", () => {
    stopGps();
    state.anchor = {
      lat:it.lat, lng:it.lng, label:it.name,
      sub:"You said you're standing here", kind:"spot", ref:it._id
    };
    save(); closeSheet(); render();
  });
  sheet.querySelector("#closeSheet").addEventListener("click", closeSheet);
}

function findStop(id){
  for(const d of DAYS){
    const hit = planItems(d).find(s => s.id === id);
    if(hit) return hit;
  }
  return null;
}
function findPick(id){
  const s = SPOTS.find(x => x.id === id);
  return s ? Object.assign({}, s, {_t:"pick"}) : null;
}
function findAny(id){ return findPick(id) || findStop(id); }

/* ---------------------------------------------------------------- gps */
function stopGps(){
  if(state.gpsWatch != null){ navigator.geolocation.clearWatch(state.gpsWatch); state.gpsWatch = null; }
}
function startGps(){
  if(!navigator.geolocation){
    state.gpsErr = "This browser will not give out a location.";
    render(); return;
  }
  state.gpsErr = "Looking for satellites. With no data this can take up to a minute.";
  render();
  state.gpsWatch = navigator.geolocation.watchPosition(pos => {
    state.gpsErr = "";
    state.anchor = {
      lat:pos.coords.latitude, lng:pos.coords.longitude,
      label:"My location",
      sub:"Accurate to about " + Math.round(pos.coords.accuracy) + " m",
      kind:"gps", ref:"__me"
    };
    render();
  }, err => {
    stopGps();
    state.gpsErr = err.code === 1
      ? "Location is turned off for this app. Settings, then Safari, then Location."
      : "Could not get a fix. Step outside, or tap a stop below instead.";
    render();
  }, {enableHighAccuracy:true, timeout:60000, maximumAge:15000});
}

/* ---------------------------------------------------------------- dragging
   Grab the ⠿ handle and pull. Pointer events, not HTML5 drag-and-drop, because
   the latter does not work by touch on iOS. The row follows your finger and the
   others slide out of the way; letting go writes the new order. */
(function(){
  let drag = null;

  function rowsFor(dayN){
    return [...document.querySelectorAll(`.row[data-rowday="${dayN}"]`)];
  }

  function start(e){
    const h = e.target.closest("[data-grab]");
    if(!h) return;
    const row = h.closest(".row");
    if(!row) return;
    const dayN = +h.dataset.gday;
    const siblings = rowsFor(dayN);
    if(siblings.length < 2) return;

    e.preventDefault();
    const rect = row.getBoundingClientRect();
    drag = {
      id: h.dataset.grab, dayN, row, siblings,
      startY: e.clientY, offset: e.clientY - rect.top,
      height: rect.height, moved: false,
      order: siblings.map(r => r.dataset.rowid),
    };
    row.classList.add("dragging");
    row.style.position = "relative";
    row.style.zIndex = "20";
    document.body.classList.add("dragging-now");
    h.setPointerCapture && h.setPointerCapture(e.pointerId);
  }

  function move(e){
    if(!drag) return;
    e.preventDefault();
    const dy = e.clientY - drag.startY;
    if(Math.abs(dy) > 3) drag.moved = true;
    drag.row.style.transform = `translateY(${dy}px)`;

    // where would it land?
    const mid = drag.row.getBoundingClientRect().top + drag.height / 2;
    let target = null;
    for(const r of drag.siblings){
      if(r === drag.row) continue;
      const b = r.getBoundingClientRect();
      if(mid > b.top && mid < b.bottom){ target = r; break; }
    }
    for(const r of drag.siblings) if(r !== drag.row) r.classList.remove("drop-above","drop-below");
    if(target){
      const b = target.getBoundingClientRect();
      target.classList.add(mid < b.top + b.height / 2 ? "drop-above" : "drop-below");
    }
  }

  function end(e){
    if(!drag) return;
    const d = drag; drag = null;
    d.row.classList.remove("dragging");
    d.row.style.transform = d.row.style.position = d.row.style.zIndex = "";
    document.body.classList.remove("dragging-now");

    let target = null, before = false;
    for(const r of d.siblings){
      if(r === d.row) continue;
      if(r.classList.contains("drop-above")){ target = r; before = true; }
      if(r.classList.contains("drop-below")){ target = r; before = false; }
      r.classList.remove("drop-above","drop-below");
    }
    if(!d.moved || !target) return;

    const order = d.order.slice();
    const from = order.indexOf(d.id);
    order.splice(from, 1);
    let to = order.indexOf(target.dataset.rowid);
    if(!before) to += 1;
    order.splice(to, 0, d.id);
    ORDER[d.dayN] = order;
    saveOrder();
    render();
  }

  document.addEventListener("pointerdown", start, {passive:false});
  document.addEventListener("pointermove", move, {passive:false});
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
})();

/* ---------------------------------------------------------------- wiring */
function render(){
  writeHash();
  renderStrip();
  main.innerHTML =
      state.tab === "plan" ? viewPlan()
    : state.tab === "trip" ? viewTrip()
    : state.tab === "near" ? viewNear()
    :                        viewMap();
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.tab === state.tab));
}

document.addEventListener("click", e => {
  const mk = e.target.closest("[data-mark]");
  if(mk){ setMark(mk.dataset.mid, mk.dataset.mark); return; }

  const mv = e.target.closest("[data-move]");
  if(mv){
    const dn = +mv.dataset.mday;
    const d = DAYS.find(x => x.n === dn);
    if(d) movePick(dn, visiblePickIds(d), mv.dataset.mid, mv.dataset.move === "up" ? -1 : 1);
    return;
  }

  const cat = e.target.closest("[data-cat]");
  if(cat){
    state.nearCat = cat.dataset.cat || "";
    if(state.openItem) openSheet(state.openItem);
    return;
  }

  const del = e.target.closest("[data-del]");
  if(del){ remove(del.dataset.del); return; }
  const res = e.target.closest("[data-restore]");
  if(res){ restore(res.dataset.restore); return; }

  const tab = e.target.closest(".tab");
  if(tab){ state.tab = tab.dataset.tab; window.scrollTo(0,0); render(); return; }

  const jump = e.target.closest("[data-jump]");
  if(jump){
    const el = document.getElementById("trip-day-" + jump.dataset.jump);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }

  const chip = e.target.closest(".chip");
  if(chip && chip.dataset.day){ state.day = +chip.dataset.day; save(); window.scrollTo(0,0); render(); return; }

  if(e.target.closest("#gpsBtn")){
    if(state.anchor && state.anchor.kind === "gps"){ stopGps(); state.anchor = null; save(); render(); }
    else startGps();
    return;
  }
  if(e.target.closest("#clearAnchor")){ stopGps(); state.anchor = null; save(); render(); return; }

  const f = e.target.closest(".f");
  if(f){ state.filter = f.dataset.f; save(); render(); return; }

  const pt = e.target.closest(".pt");
  if(pt){
    if(pt.dataset.stop){ const s = findStop(pt.dataset.stop); if(s) openSheet(s); }
    else if(pt.dataset.pick){ const s = findPick(pt.dataset.pick); if(s) openSheet(s); }
    return;
  }
  const rowStop = e.target.closest("[data-stop]");
  if(rowStop && !rowStop.classList.contains("pt")){
    const s = findStop(rowStop.dataset.stop); if(s) openSheet(s); return;
  }
  const rowPick = e.target.closest("[data-pick]");
  if(rowPick && !rowPick.classList.contains("pt")){
    const s = findPick(rowPick.dataset.pick); if(s) openSheet(s); return;
  }
  const rowGone = e.target.closest("[data-open-gone]");
  if(rowGone){
    const s = findAny(rowGone.dataset.openGone); if(s) openSheet(s); return;
  }
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("sw.js").catch(() => {}));
  /* When a new worker takes over, the page in front of you is the old build.
     Reload once so an update never leaves you reading a stale itinerary. */
  let swapped = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(swapped) return;
    swapped = true;
    location.reload();
  });
}
</script>
</body>
</html>
